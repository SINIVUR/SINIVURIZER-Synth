<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINIVURIZER Synth</title>
<meta name="theme-color" content="#1b1f23">
<meta name="description" content="멜로딕 프로그레시브 하우스 전용 웹 신디사이저 & 간이 DAW">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{
  --bg:#07090a;--panel:#111416;--panel2:#171b1e;--panel3:#1f2427;--line:#23292d;--line2:#2f373c;
  --text:#e6f2ea;--dim:#7d8c84;--acc:#39ff6a;--acc2:#ff2d55;--green:#39ff6a;--red:#ff2d55;--yel:#d4ff3a;
  --font:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.35 var(--font);overflow:hidden;user-select:none}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel3);border:1px solid var(--line2);border-radius:4px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{background:#45505a;border-color:#5d6874}
button.on{background:var(--acc);color:#04130a;border-color:var(--acc);font-weight:700;box-shadow:0 0 8px rgba(57,255,106,.5)}
button.pri{background:linear-gradient(#5dff86,#1fd94f);color:#04130a;border-color:#39ff6a;font-weight:800;box-shadow:0 0 12px rgba(57,255,106,.45)}
button.red{background:linear-gradient(#ff5577,#e0123d);color:#fff;border-color:#ff2d55;font-weight:800;box-shadow:0 0 12px rgba(255,45,85,.45)}
button.pri:hover{filter:brightness(1.08)}
button.sm{padding:2px 6px;font-size:11px}
button.icon{width:30px;height:28px;padding:0;font-size:14px}
select,input[type=text],input[type=number],input[type=search]{background:#171b1f;border:1px solid var(--line2);border-radius:4px;padding:3px 6px;outline:none}
select:focus,input:focus{border-color:var(--acc)}
select{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#1a1e22}::-webkit-scrollbar-thumb{background:#46505a;border-radius:5px}

#app{display:grid;grid-template-rows:52px 1fr 24px;height:100vh}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:7px;padding:0 8px;background:linear-gradient(#141819,#0b0d0e);border-bottom:1px solid #39ff6a33;box-shadow:0 1px 14px rgba(57,255,106,.12);overflow-x:auto;overflow-y:hidden}
#logo{font-weight:800;letter-spacing:1px;font-size:15px;white-space:nowrap;background:linear-gradient(90deg,#39ff6a,#c8ff3a 45%,#ff2d55);filter:drop-shadow(0 0 6px rgba(57,255,106,.5));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:default}
#logo small{display:block;font-size:9px;letter-spacing:3px;color:var(--dim);-webkit-text-fill-color:var(--dim);font-weight:600}
.grp{display:flex;align-items:center;gap:5px;padding:4px 7px;background:#1a1e22;border:1px solid #11151a;border-radius:6px;white-space:nowrap}
.grp label{color:var(--dim);font-size:11px}
#btnPlay.on{background:var(--green);border-color:var(--green);color:#04130a;box-shadow:0 0 12px var(--green)}
#btnRec.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 12px var(--red)}
#posDisp{font:700 14px/1 Consolas,monospace;color:var(--green);text-shadow:0 0 8px var(--green);min-width:74px;text-align:center;background:#0e1114;padding:6px 8px;border-radius:4px}
#bpm{width:58px;text-align:center;font-weight:800;color:var(--red);text-shadow:0 0 6px rgba(255,45,85,.6)}
#scope{background:#0e1114;border-radius:4px;border:1px solid #11151a}
.sp{flex:1}
/* ---------- body ---------- */
#body{display:grid;grid-template-columns:300px 230px 1fr;min-height:0}
#body.nobrowser{grid-template-columns:0 230px 1fr}
#browser{background:var(--panel);border-right:1px solid #111;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px 6px 0;background:#20252a;border-bottom:1px solid var(--line)}
.tabs button{border-radius:5px 5px 0 0;border-bottom:none;background:transparent;border-color:transparent;color:var(--dim);padding:6px 9px}
.tabs button.on{background:var(--panel);color:var(--acc);border-color:var(--line);font-weight:700}
.bpane{flex:1;overflow:auto;padding:8px;display:none}
.bpane.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{padding:2px 8px;border-radius:10px;background:#1a1e22;border:1px solid var(--line2);cursor:pointer;font-size:11px;color:var(--dim)}
.chip.on{background:var(--acc2);color:#fff;border-color:var(--acc2);font-weight:700;box-shadow:0 0 8px rgba(255,45,85,.5)}
.list{display:flex;flex-direction:column;gap:3px}
.item{padding:6px 8px;border-radius:5px;background:#20262b;border:1px solid transparent;cursor:pointer}
.item:hover{border-color:var(--line2);background:#262d33}
.item.on{border-color:var(--acc);background:#0f2416;box-shadow:inset 0 0 0 1px rgba(57,255,106,.25)}
.item .t{font-weight:600}
.item .s{color:var(--dim);font-size:11px;margin-top:1px}
.item .row{display:flex;align-items:center;gap:6px}
.badge{font-size:10px;padding:1px 6px;border-radius:8px;background:#36404a;color:#cfd8df;white-space:nowrap}
.card{background:#1d2227;border:1px solid var(--line2);border-radius:7px;padding:10px;margin-bottom:8px}
.card h3{margin:0 0 4px;font-size:15px;color:var(--acc);text-shadow:0 0 8px rgba(57,255,106,.45)}
.card p{margin:4px 0;color:#c2cbd2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:11px;margin:6px 0}
.kv b{color:var(--dim);font-weight:500}
.btnrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.field>span{color:var(--dim);font-size:11px}
.field select,.field input{width:100%}
.field input[type=checkbox]{width:auto}
.chk label{white-space:nowrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
h4{margin:10px 0 5px;color:var(--acc2);font-size:12px}
.guide{font-size:11.5px;color:#c2cbd2}
.guide li{margin:2px 0}
.chk{display:flex;flex-wrap:wrap;gap:4px 10px;margin:4px 0}
.chk label{display:flex;align-items:center;gap:3px;cursor:pointer}

/* ---------- rack ---------- */
#rack{background:#22272c;border-right:1px solid #111;display:flex;flex-direction:column;min-height:0}
#rack .hd{padding:7px 8px;font-weight:700;color:var(--dim);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
#trackList{flex:1;overflow:auto;padding:5px}
.trk{display:grid;grid-template-columns:6px 1fr auto;gap:6px;align-items:center;padding:6px 6px 6px 0;margin-bottom:4px;background:#14181a;border:1px solid #1f2528;border-radius:5px;cursor:pointer;position:relative}
.trk:hover{background:#1a2023}
.trk.sel{border-color:var(--acc);background:#0f2016;box-shadow:0 0 10px rgba(57,255,106,.25)}
.trk .clr{height:100%;border-radius:4px 0 0 4px}
.trk .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .ps{font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .ms{display:flex;gap:3px}
.trk .ms button{width:24px;height:18px;padding:0;font-size:10px;font-weight:700}
.trk .ms button.mon{background:#6b7680;color:#111}
.trk .ms button.son{background:var(--acc);color:#04130a}
.trk .ms button.mon{background:var(--red);color:#fff}
.trk .vm{grid-column:2/4;display:flex;align-items:center;gap:5px}
.trk .vm input{flex:1;height:12px}
.trk canvas.meter{position:absolute;right:3px;top:4px;width:4px;height:calc(100% - 8px)}
input[type=range]{accent-color:var(--acc);cursor:pointer}

/* ---------- workspace ---------- */
#work{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#wtabs{display:flex;align-items:center;gap:2px;padding:5px 8px 0;white-space:nowrap;overflow-x:auto;overflow-y:hidden;background:#20252a;border-bottom:1px solid var(--line)}
#wtabs button{border-radius:5px 5px 0 0;border-bottom:none;background:transparent;border-color:transparent;color:var(--dim);padding:6px 12px;font-weight:600}
#wtabs button.on{background:var(--panel);color:var(--acc);border-color:var(--line);text-shadow:0 0 6px rgba(57,255,106,.5)}
#wtabs .cur{margin-left:auto;color:var(--dim);padding:0 6px 0 10px;white-space:nowrap}
#wtabs .secbar span{white-space:nowrap}
#wtabs .cur b{color:var(--text)}
.wpane{flex:1;display:none;min-height:0;min-width:0;flex-direction:column}
.wpane.on{display:flex}
.toolbar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .sep{width:1px;height:20px;background:var(--line2);margin:0 3px}
#rollWrap{flex:1;position:relative;min-height:0;overflow:hidden}
#roll{position:absolute;left:0;top:0;cursor:crosshair}
#hscroll{height:12px;width:100%;margin:0;display:block}

/* ---------- synth ---------- */
#synthPane{overflow:auto;padding:8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.mod{background:linear-gradient(#13171a,#0e1113);border:1px solid #1e2629;border-radius:7px;padding:7px 8px;position:relative}
.mod .mh{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:800;color:var(--acc);text-shadow:0 0 6px rgba(57,255,106,.35);letter-spacing:.5px;font-size:11.5px}
.mod .mh .pw{width:14px;height:14px;border-radius:50%;border:2px solid #555;background:#222;cursor:pointer;padding:0}
.mod .mh .pw.on{background:var(--green);border-color:#3c8;box-shadow:0 0 6px var(--green)}
.mod .mh select{margin-left:auto;max-width:125px}
.mod .mh>span{white-space:nowrap}
.mod.off .knobs{opacity:.35}
.mod.wide{grid-column:span 2}
.knobs{display:flex;flex-wrap:wrap;gap:4px 2px}
.knob{width:52px;display:flex;flex-direction:column;align-items:center;cursor:ns-resize;touch-action:none}
.knob svg{width:38px;height:38px}
.knob .kl{font-size:10px;color:var(--dim);text-align:center;white-space:nowrap}
.knob .kv{font-size:10px;color:var(--acc2);font-family:Consolas,monospace;height:12px;white-space:nowrap}
.knob:hover .kl{color:var(--text)}
canvas.gfx{width:100%;background:#101418;border:1px solid #0a0d10;border-radius:5px;display:block}
.presetbar{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.presetbar .pn{font-size:15px;font-weight:800;color:var(--text);padding:3px 10px;background:#101418;border-radius:5px;min-width:200px;border:1px solid var(--line2)}

/* ---------- drums ---------- */
#drumPane{overflow:auto}
#drumGrid{padding:8px;overflow-x:auto}
.dlane{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.dlane .dn{width:150px;flex:none;display:flex;align-items:center;gap:4px;font-weight:600}
.dlane .dn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlane .dn button{width:20px;height:18px;padding:0;font-size:10px}
.dlane .dn input{width:46px}
.steps{display:flex;gap:2px}
.st{width:20px;height:24px;border-radius:3px;background:#1d2427;border:1px solid #11161a;cursor:pointer;flex:none}
.st.b2{background:#2a1c20}
.st.on{background:var(--acc);border-color:#b6ffc8;box-shadow:0 0 6px rgba(57,255,106,.6)}
.st.gh{background:#1c8a3a}
.st.ac{background:var(--red);border-color:#ffb3c2;box-shadow:0 0 8px rgba(255,45,85,.7)}
.st.cur{outline:2px solid #fff;outline-offset:-1px}
.st.barStart{margin-left:6px}

/* ---------- mixer ---------- */
#mixPane{overflow:auto;padding:10px;display:flex;flex:1;gap:8px;align-items:stretch;flex-direction:row}
#mixPane.on{display:flex}
.strip{width:98px;flex:none;background:linear-gradient(#13171a,#0d1012);border:1px solid #1e2629;border-radius:7px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.strip .snm{font-weight:800;text-align:center;width:100%;padding:3px;border-radius:4px;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .fad{display:flex;gap:6px;align-items:stretch;height:200px}
.strip .fad input{writing-mode:vertical-lr;direction:rtl;width:22px;height:200px}
.strip canvas{width:14px;height:200px;background:#0b0e11;border-radius:3px}
.strip.master{width:150px;border-color:var(--acc)}
#spec{width:100%;height:90px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid #39ff6a55;border-radius:10px;padding:16px 18px;max-width:720px;width:92vw;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal h2{margin:0 0 10px;color:var(--acc);font-size:17px}
#modal table{border-collapse:collapse;width:100%;font-size:12px}
#modal td{padding:3px 6px;border-bottom:1px solid var(--line)}
#modal td:first-child{color:var(--acc2);font-family:Consolas,monospace;white-space:nowrap}
kbd{background:#111;border:1px solid #444;border-radius:3px;padding:0 4px;font-family:Consolas,monospace}
/* ---------- hint ---------- */
#hint{display:flex;align-items:center;gap:10px;padding:0 10px;background:#15191d;border-top:1px solid #0d1013;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden}
#hint b{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#06110a;border:1px solid var(--acc);box-shadow:0 0 18px rgba(57,255,106,.35);color:var(--text);padding:8px 16px;border-radius:6px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
#welcome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}

/* easy mode + sections */
.easy{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:center;padding:6px 4px}
.easy .knob{width:76px}
.mod.full{grid-column:1/-1}
.easy .knob svg{width:64px;height:64px}
.easy .knob .kl{font-size:12.5px;font-weight:700;color:var(--text)}
.easy .knob .kv{font-size:11px}
.secbar{display:flex;align-items:center;gap:3px;margin-bottom:3px}
.secbar button{padding:3px 8px;font-size:11.5px}
.secbar button.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 10px rgba(255,45,85,.6)}
.bigbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.bigbtns button{padding:16px 10px;font-size:14px;line-height:1.4;white-space:normal}
.bigbtns button small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:4px}
.modeTgl{margin-left:auto}

#top .grp{padding:4px 5px;gap:4px}
#keyRoot{width:64px}
#keyMode{width:112px}
#perf{width:82px}
#logo{font-size:14px}
@media (max-width:1500px){#logo small{display:none}}
/* tutorial */
#tutSpot{position:fixed;z-index:90;border:2px solid var(--acc);border-radius:9px;box-shadow:0 0 0 9999px rgba(0,0,0,.72),0 0 22px rgba(57,255,106,.7);pointer-events:none;transition:all .28s ease}
#tutCard{position:fixed;z-index:91;background:linear-gradient(#141a17,#0b0e0c);border:1px solid var(--acc);border-radius:12px;padding:12px 16px 14px;box-shadow:0 18px 60px rgba(0,0,0,.7),0 0 24px rgba(57,255,106,.25);max-height:calc(100vh - 20px);overflow:auto;transition:left .28s ease,top .28s ease}
#tutCard h3{margin:4px 0 8px;font-size:16px;color:var(--acc);text-shadow:0 0 8px rgba(57,255,106,.45)}
#tutCard .tutBody{font-size:12.5px;line-height:1.6;color:#d5e6db}
#tutCard .tutBody ul,#tutCard .tutBody ol{margin:6px 0;padding-left:18px}
#tutCard .tutBody li{margin:3px 0}
#tutCard .tutBody b{color:#fff}
#tutCard .tutBody p{margin:6px 0}
.tutProg{height:4px;background:#1d2622;border-radius:2px;overflow:hidden}
.tutProg div{height:100%;background:linear-gradient(90deg,var(--acc),var(--red));box-shadow:0 0 8px var(--acc)}
.tutHead{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tutNum{color:var(--red);font-weight:800;font-family:Consolas,monospace}
.tutNav{display:flex;justify-content:space-between;margin-top:12px}
.tutNav button{padding:7px 16px}
.tutNav button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <div id="logo" data-hint="SINIVURIZER Synth — 멜로딕 프로그레시브 하우스 전용 신디사이저 & 간이 DAW">SINIVURIZER<small>멜로딕 프로그레시브 신디사이저</small></div>
  <button class="icon" id="btnBrowser" data-hint="브라우저(아티스트/코드/프리셋/작곡 도우미) 패널 열기·닫기">☰</button>
  <div class="grp">
   <button class="icon" id="btnPlay" data-hint="재생 / 정지 <b>Space</b>">▶</button>
   <button class="icon" id="btnStop" data-hint="정지하고 처음으로">■</button>
   <button class="icon" id="btnRec" data-hint="녹음: 재생 중 키보드/MIDI 건반 연주를 피아노 롤에 기록 (스냅 적용)">●</button>
   <button class="icon" id="btnMetro" data-hint="메트로놈">♩</button>
   <div id="posDisp">1:1:1</div>
  </div>
  <div class="grp">
   <label>템포</label><input id="bpm" type="number" min="60" max="200" step="0.5" data-hint="템포 (마우스 휠로도 조절)">
   <label>키</label><select id="keyRoot" data-hint="곡의 키 — 피아노 롤 스케일 하이라이트와 작곡 도우미에 사용"></select>
   <select id="keyMode"><option value="min">마이너 (단조)</option><option value="maj">메이저 (장조)</option></select>
   <label>길이</label><select id="bars" data-hint="루프(패턴) 길이 (마디)"><option>4</option><option>8</option><option>16</option><option>32</option><option>64</option></select>
  </div>
  <div class="grp" data-hint="마스터 볼륨 / 오실로스코프"><label>마스터</label><input id="masterVol" type="range" min="0" max="1.2" step="0.01" style="width:70px"><canvas id="scope" width="100" height="34"></canvas></div>
  <div class="sp"></div>
  <div class="grp">
   <button id="btnUndo" class="sm" data-hint="실행 취소 <b>Ctrl+Z</b>">↶</button>
   <button id="btnRedo" class="sm" data-hint="다시 실행 <b>Ctrl+Y</b>">↷</button>
   <select id="perf" data-hint="성능 모드 — 렉이 걸리면 <b>절약</b>으로 (실시간 재생만 가벼워지고, 내보내기는 항상 최고 품질)"></select>
   <button id="btnNew" class="sm" data-hint="새 프로젝트: <b>완전 새로 시작</b>(빈 프로젝트) 또는 기본 템플릿">새로</button>
   <button id="btnOpen" class="sm" data-hint="프로젝트 파일(.sinv.json) 또는 MIDI(.mid) 열기">열기</button>
   <button id="btnSave" class="sm" data-hint="프로젝트 저장 (.sinv.json) <b>Ctrl+S</b>">저장</button>
   <button id="btnExport" class="pri" data-hint="WAV · 스템 · MIDI 내보내기">⤓ 내보내기</button>
   <button id="btnInstall" class="sm" style="display:none" data-hint="PWA 앱으로 컴퓨터에 설치">📥 앱 설치</button>
   <button id="btnHelp" class="sm" data-hint="단축키 · 사용법 · 설치 방법">?</button>
  </div>
  <input type="file" id="fileIn" accept=".json,.sinv,.mid,.midi" style="display:none">
 </header>

 <div id="body">
  <aside id="browser">
   <div class="tabs" id="btabs">
    <button data-b="artist" class="on">아티스트</button><button data-b="prog">코드 진행</button><button data-b="preset">프리셋</button><button data-b="gen">작곡 도우미</button>

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(base, over){
  const out = deepClone(base);
  for(const k in over){
    if(over[k] && typeof over[k]==='object' && !Array.isArray(over[k]) && out[k] && typeof out[k]==='object') out[k] = deepMerge(out[k], over[k]);
    else out[k] = over[k];
  }
  return out;
}

function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function syncToBeats(s){
  if(!s||s==='off') return 0;
  let mult=1; if(s.endsWith('T')){mult=2/3;s=s.slice(0,-1);} else if(s.endsWith('D')){mult=1.5;s=s.slice(0,-1);}
  const [a,b]=s.split('/').map(Number); return 4*a/b*mult;
}
function dlyBeats(s){ const [a,b]=s.split('/').map(Number); return 4*a/b; }

/* ---------- wavetable coefficients ---------- */
function lerpArr(a,b,t){ const o=new Float32Array(a.length); for(let i=0;i<a.length;i++) o[i]=a[i]+(b[i]-a[i])*t; return o; }
function basicShape(type){
  const re=new Float32Array(NH), im=new Float32Array(NH);
  for(let n=1;n<NH;n++){
    if(type==='sine'){ if(n===1) im[n]=1; }
    else if(type==='triangle'){ if(n%2) im[n]=8/(Math.PI*Math.PI*n*n)*(((n-1)/2)%2?-1:1); }
    else if(type==='saw'){ im[n]=2/(Math.PI*n)*(n%2?1:-1); }
    else if(type==='square'){ if(n%2) im[n]=4/(Math.PI*n); }
  }
  return {re,im};
}
const VOWELS=[[800,1150,2900],[400,1600,2700],[350,2300,3000],[450,800,2830],[325,700,2530]];
function waveCoeffs(type, wt, custom){
  wt = clamp(+wt||0,0,1);
  if(['sine','triangle','saw','square'].includes(type)) return basicShape(type);
  const re=new Float32Array(NH), im=new Float32Array(NH);
  if(type==='pwm'){
    const d=0.5-wt*0.46;
    for(let n=1;n<NH;n++) re[n]=2/(Math.PI*n)*Math.sin(Math.PI*n*d);
    return {re,im};
  }
  if(type==='basic'){
    const seq=['sine','triangle','saw','square'].map(basicShape);
    const x=wt*3, i=Math.min(2,Math.floor(x)), f=x-i;
    return {re:lerpArr(seq[i].re,seq[i+1].re,f), im:lerpArr(seq[i].im,seq[i+1].im,f)};
  }
  if(type==='harmonic'){
    const k=(1-wt)*0.9+0.015;
    for(let n=1;n<NH;n++) im[n]=(1/n)*Math.exp(-(n-1)*k);
    return {re,im};
  }
  if(type==='organ'){
    const bars=[[1,1],[2,0.8],[3,0.6],[4,0.55],[6,0.35],[8,0.4],[10,0.2],[12,0.25],[16,0.15]];
    bars.forEach(([h,w],i)=>{ im[h]=w*(i===0?1:(0.15+wt*0.85)); });
    return {re,im};
  }
  if(type==='vocal'){
    const x=wt*4, i=Math.min(3,Math.floor(x)), f=x-i;
    const F=VOWELS[i].map((v,j)=>v+(VOWELS[i+1][j]-v)*f), G=[1,0.6,0.3];
    for(let n=1;n<NH;n++){
      const hz=n*180; let w=0.02/n;
      F.forEach((fr,j)=>{ w+=G[j]*Math.exp(-Math.pow((hz-fr)/(110+j*60),2)); });
      im[n]=w;
    }
    return {re,im};
  }
  if(type==='custom' && custom && custom.length){
    const N=custom.length;
    for(let n=1;n<Math.min(NH,N/2);n++){
      let a=0,b=0;
      for(let k=0;k<N;k++){ const ph=2*Math.PI*n*k/N; a+=custom[k]*Math.cos(ph); b+=custom[k]*Math.sin(ph); }

    }
    return {re,im};
  }
  return basicShape('saw');
}
function waveSamples(type, wt, custom, N=256){
  const {re,im}=waveCoeffs(type,wt,custom), out=new Float32Array(N);
  let mx=0;
  for(let k=0;k<N;k++){
    let s=0; const x=2*Math.PI*k/N;
    for(let n=1;n<64;n++){ if(re[n]) s+=re[n]*Math.cos(n*x); if(im[n]) s+=im[n]*Math.sin(n*x); }
    out[k]=s; mx=Math.max(mx,Math.abs(s));
  }
  if(mx>0) for(let k=0;k<N;k++) out[k]/=mx;
  return out;
}
const _waveCache = new WeakMap();
function getWave(ctx, type, wt, custom, cid){
  let m=_waveCache.get(ctx); if(!m){m=new Map();_waveCache.set(ctx,m);}
  const key=type+'|'+(['pwm','basic','harmonic','organ','vocal'].includes(type)?(+wt).toFixed(3):'')+'|'+(type==='custom'?cid:'');
  let w=m.get(key);
  if(!w){ const c=waveCoeffs(type,wt,custom); w=ctx.createPeriodicWave(c.re,c.im); m.set(key,w); if(m.size>400){ m.delete(m.keys().next().value); } }
  return w;
}
const _noiseCache = new WeakMap();
function getNoise(ctx){
  let b=_noiseCache.get(ctx);
  if(!b){ b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; _noiseCache.set(ctx,b); }
  return b;
}
const _irCache = new WeakMap();
function getIR(ctx, size){
  size=Math.round(clamp(size,0.3,8)*10)/10;
  let m=_irCache.get(ctx); if(!m){m=new Map();_irCache.set(ctx,m);}
  if(m.has(size)) return m.get(size);
  const sr=ctx.sampleRate, len=Math.floor(sr*size), b=ctx.createBuffer(2,len,sr), pre=Math.floor(sr*0.012);
  for(let c=0;c<2;c++){
    const d=b.getChannelData(c); let lp=0;
    for(let i=pre;i<len;i++){
      const t=(i-pre)/len; lp=lp*0.55+(Math.random()*2-1)*0.45;
      d[i]=lp*Math.pow(1-t,2.2)*Math.exp(-t*3);
    }
  }
  m.set(size,b); return b;
}
function driveCurve(amt){
  if(amt<=0.001) return null;
  const k=1+amt*24, n=2048, c=new Float32Array(n), nk=Math.tanh(k);
  for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=Math.tanh(k*x)/nk; }
  return c;
}

/* ---------- Track FX chain ---------- */
function buildChain(ctx, track, dest, bpm, M){
  const C={ctx, track};
  const N=(fn)=>fn;
  C.input=ctx.createGain();
  C.shaper=ctx.createWaveShaper(); C.shaper.oversample='2x';
  C.hpf=ctx.createBiquadFilter(); C.hpf.type='highpass'; C.hpf.Q.value=0.7;
  C.eqL=ctx.createBiquadFilter(); C.eqL.type='lowshelf'; C.eqL.frequency.value=150;
  C.eqM=ctx.createBiquadFilter(); C.eqM.type='peaking'; C.eqM.frequency.value=1000; C.eqM.Q.value=0.8;
  C.eqH=ctx.createBiquadFilter(); C.eqH.type='highshelf'; C.eqH.frequency.value=6000;
  C.input.connect(C.shaper); C.shaper.connect(C.hpf); C.hpf.connect(C.eqL); C.eqL.connect(C.eqM); C.eqM.connect(C.eqH);
  // chorus
  C.chDry=ctx.createGain(); C.chWet=ctx.createGain();
  C.post=ctx.createGain();
  C.eqH.connect(C.chDry); C.chDry.connect(C.post);
  const merger=ctx.createChannelMerger(2);
  C.chLfo=ctx.createOscillator(); C.chLfo.frequency.value=0.7;
  [0.012,0.018].forEach((base,i)=>{
    const d=ctx.createDelay(0.1); d.delayTime.value=base;
    const g=ctx.createGain(); g.gain.value=0.0025*(i?-1:1);
    C.chLfo.connect(g); g.connect(d.delayTime);
    C.eqH.connect(d); d.connect(merger,0,i);
  });
  merger.connect(C.chWet); C.chWet.connect(C.post);
  // sum
  C.sum=ctx.createGain();
  C.post.connect(C.sum);
  // delay ping pong
  C.dSend=ctx.createGain(); C.post.connect(C.dSend);
  C.dL=ctx.createDelay(3); C.dR=ctx.createDelay(3);
  C.dFb=ctx.createGain(); C.dDamp=ctx.createBiquadFilter(); C.dDamp.type='lowpass'; C.dDamp.frequency.value=5000;
  const dm=ctx.createChannelMerger(2);
  C.dSend.connect(C.dL); C.dL.connect(C.dR); C.dR.connect(C.dDamp); C.dDamp.connect(C.dFb); C.dFb.connect(C.dL);
  C.dL.connect(dm,0,0); C.dR.connect(dm,0,1); dm.connect(C.sum);
  // reverb
  // reverb: send to two shared master reverbs (short / long) — much lighter than one convolver per track
  C.rSendS=ctx.createGain(); C.rSendL=ctx.createGain(); C.rSendS.gain.value=0; C.rSendL.gain.value=0;
  C.post.connect(C.rSendS); C.post.connect(C.rSendL);
  if(M&&M.revS){ C.rSendS.connect(M.revS); C.rSendL.connect(M.revL); }
  // trem/pump/pan/vol
  C.trem=ctx.createGain(); C.pump=ctx.createGain(); C.pan=ctx.createStereoPanner(); C.vol=ctx.createGain();
  C.sum.connect(C.trem); C.trem.connect(C.pump); C.pump.connect(C.pan); C.pan.connect(C.vol);
  C.meter=ctx.createAnalyser(); C.meter.fftSize=512;
  C.vol.connect(C.meter); C.vol.connect(dest);
  // LFOs (per track, shared by voices)
  C.lfos=[0,1].map(()=>{
    const o=ctx.createOscillator();
    const L={osc:o,cut:ctx.createGain(),pitch:ctx.createGain(),amp:ctx.createGain(),pan:ctx.createGain()};
    ['cut','pitch','amp','pan'].forEach(k=>{L[k].gain.value=0; o.connect(L[k]);});
    L.amp.connect(C.trem.gain); L.pan.connect(C.pan.pan);
    return L;
  });
  C.chLfo.start(0); C.lfos.forEach(L=>L.osc.start(0));
  C._rev=-1;
  C.update=(bpmNow)=>updateChain(C, bpmNow||bpm);
  C.update(bpm);
  return C;
}
function updateChain(C, bpm){
  const ctx=C.ctx, t=C.track, fx=(t.params||t).fx||{}, now=ctx.currentTime;
  const set=(p,v)=>{ try{ p.setValueAtTime(v,now);}catch(e){p.value=v;} };
  C.shaper.curve=driveCurve(fx.drive||0);
  set(C.hpf.frequency, clamp(fx.hpf||20,10,2000));
  set(C.eqL.gain, fx.eqL||0); set(C.eqM.gain, fx.eqM||0); set(C.eqH.gain, fx.eqH||0);
  const ch=fx.chorus||0; set(C.chDry.gain,1-ch*0.4); set(C.chWet.gain,ch*0.8);
  set(C.dSend.gain, (fx.dly||0)*0.7);
  const dt=clamp(dlyBeats(fx.dlyTime||'3/16')*60/bpm,0.01,2.9);
  set(C.dL.delayTime,dt); set(C.dR.delayTime,dt); set(C.dFb.gain, clamp(fx.dlyFb||0.35,0,0.9));
  const rv=(fx.rev||0)*0.9, mixL=clamp(((fx.revSize||2.5)-1.2)/3.3,0,1);
  set(C.rSendS.gain, C.muted?0:rv*(1-mixL)); set(C.rSendL.gain, C.muted?0:rv*mixL);
  set(C.pan.pan, clamp(t.pan||0,-1,1));
  set(C.vol.gain, C.muted?0:(t.vol==null?0.8:t.vol));
  // LFOs
  const p=t.params;
  if(p){
    [p.lfo1,p.lfo2].forEach((lf,i)=>{
      const L=C.lfos[i]; if(!lf) return;
      L.osc.type = lf.shape==='saw'?'sawtooth':(lf.shape||'sine');
      const beats=syncToBeats(lf.sync);
      set(L.osc.frequency, beats? (bpm/60)/beats : clamp(lf.rate||1,0.01,40));
      const a=lf.on?(lf.amt||0):0;
      set(L.cut.gain, lf.target==='cutoff'?a*2400:0);
      set(L.pitch.gain, lf.target==='pitch'?a*200:0);
      set(L.amp.gain, lf.target==='amp'?a*0.5:0);
      set(L.pan.gain, lf.target==='pan'?a:0);
    });
    const ampA = [p.lfo1,p.lfo2].reduce((s,lf)=>s+((lf&&lf.on&&lf.target==='amp')?(lf.amt||0)*0.5:0),0);
    set(C.trem.gain, 1-ampA);
  } else set(C.trem.gain,1);
}
function schedulePump(C, time, beatDur){
  const fx=(C.track.params||C.track).fx||{}; const amt=fx.pump||0;
  if(amt<=0.001) return;
  const g=C.pump.gain, depth=clamp(amt,0,1)*0.92;
  g.setValueAtTime(1,time);
  g.linearRampToValueAtTime(1-depth,time+0.006);
  g.setTargetAtTime(1,time+0.02,beatDur*0.18);
  g.setValueAtTime(1,time+beatDur*0.97);
}

/* ---------- Synth voice ---------- */
function envLevel(env, x, peak){ // x = seconds since note start
  const a=Math.max(0.001,env.a);
  if(x<a) return peak*x/a;
  const tau=Math.max(0.005,env.d)/4;
  return peak*(env.s+(1-env.s)*Math.exp(-(x-a)/tau));
}
function playSynth(ctx, C, p, midi, t, dur, vel, glideFrom, customId){
  vel=vel==null?0.85:vel;
  const voiceOct=(p.voice.oct||0)*12;
  const note=midi+voiceOct, freq=mtof(note);
  const amp=ctx.createGain(); amp.gain.value=0;
  const mix=ctx.createGain();
  const nodes=[], dets=[], filters=[];
  // filter
  let last=mix;
  const fl=p.flt;
  if(fl.on){
    const t2=fl.type, base=t2.slice(0,2), mapType={lp:'lowpass',hp:'highpass',bp:'bandpass',no:'notch'};
    const typ=mapType[base]||'lowpass';
    const count=t2.endsWith('24')?2:1;
    for(let i=0;i<count;i++){
      const f=ctx.createBiquadFilter(); f.type=typ;
      f.Q.value = (typ==='lowpass'||typ==='highpass') ? (i===0?Math.max(0.3,fl.res):0.6) : Math.max(0.5,fl.res);
      last.connect(f); last=f; filters.push(f);

  const act=C.active||(C.active=[]);
  for(let i=act.length-1;i>=0;i--) if(act[i].end!=null&&act[i].end<t) act.splice(i,1);
  const maxV=ctx.__live?(ctx.__maxVoices||24):48;
  while(act.length>=maxV){ const o=act.shift(); try{ o.amp.gain.cancelScheduledValues(t); o.amp.gain.setTargetAtTime(0,t,0.008); o.nodes.forEach(n=>{try{n.stop(t+0.05);}catch(e){}}); o.end=t+0.05; o.released=true; }catch(e){} }

    const wave=getWave(ctx,o.wave,o.wt,p.custom,customId);
    const baseDet=(o.oct||0)*1200+(o.semi||0)*100+(o.fine||0);
    for(let i=0;i<n;i++){
      const pos=n===1?0:(i/(n-1))*2-1;

      const dc=baseDet+pos*maxC; osc.detune.setValueAtTime(dc,t);
      dets.push([osc.detune,dc]);

      const center=Math.abs(pos)<0.34||n<3;
      g.gain.value=o.level*(center?1:(o.blend!=null?o.blend:0.7))/Math.sqrt(n);
      const pn=ctx.createStereoPanner(); pn.pan.value=clamp(pos*(o.width!=null?o.width:0.8)+(o.pan||0),-1,1);
      osc.connect(g); g.connect(pn); pn.connect(mix);
      lp.forEach(i=>L[i].pitch.connect(osc.detune));
      const off=o.rand? Math.random()/freq : 0;
      osc.start(t+off); nodes.push(osc);
    }

/* ---------- Drum synth ---------- */
const DRUM_LANES = [
  ['kick','킥',36],['clap','클랩',39],['snare','스네어',38],['chat','클로즈 햇',42],['ohat','오픈 햇',46],

    o.frequency.exponentialRampToValueAtTime(44*kit.kickTune,t+kit.kickDecay);

    const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(260,t); o.frequency.exponentialRampToValueAtTime(150,t+0.18);

    const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(30,t+1.5);
    const g=ctx.createGain(); env(g,0.9,0.002,1.6,t); o.connect(g); g.connect(out); o.start(t); o.stop(t+2.5);

  }
}

/* ---------- Master ---------- */
function buildMaster(ctx, dest){
  const M={};
  M.input=ctx.createGain(); M.input.gain.value=0.9;
  M.comp=ctx.createDynamicsCompressor();
  M.comp.threshold.value=-8; M.comp.knee.value=4; M.comp.ratio.value=8; M.comp.attack.value=0.003; M.comp.release.value=0.15;
  M.clip=ctx.createWaveShaper(); const c=new Float32Array(1024); for(let i=0;i<1024;i++){const x=i/1023*2-1;c[i]=Math.tanh(x*1.2)/Math.tanh(1.2);} M.clip.curve=c;
  M.vol=ctx.createGain(); M.vol.gain.value=0.9;
  M.analyser=ctx.createAnalyser(); M.analyser.fftSize=2048; M.analyser.smoothingTimeConstant=0.8;

  return M;
}

/* ---------- Song scheduling (shared by live + offline) ---------- */

  }

}

    const C=chains[t.id]; if(!C) continue;
    if(!trackAudible(project,t,opts.only)) continue;
    if(sec&&sec.roles&&!sec.roles.has(t.role)) continue;
    if(t.type==='drums'){
      const D=(sec&&sec.drum)||t;

      for(let st=Math.ceil(T0/STEP); st*STEP<T1; st++){
        const local=((st*STEP)%L+L)%L; const idx=Math.floor(local/STEP)%len;
        for(let li=0;li<D.lanes.length;li++){

}

/* ---------- Offline render ---------- */
async function renderProject(project, opts){
  opts=opts||{};

  const tickDur=60/project.bpm/PPQ, L=project.bars*BAR;

  const chains={};
  for(const t of project.tracks) chains[t.id]=buildChain(ctx,t,M.input,project.bpm,M);
  scheduleWindow(ctx,project,chains,0,L*loops,(tk)=>tk*tickDur,tickDur,{only:opts.only,section:opts.section});

/* ---------- WAV ---------- */
function encodeWav(buf, bits){
  bits=bits||16;

  const data=new ArrayBuffer(44+len*ch*bps), v=new DataView(data);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+len*ch*bps,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,ch,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*ch*bps,true); v.setUint16(32,ch*bps,true); v.setUint16(34,bits,true); ws(36,'data'); v.setUint32(40,len*ch*bps,true);
  const chans=[]; for(let c=0;c<ch;c++) chans.push(buf.getChannelData(c));
  let o=44;

    const s=clamp(chans[c][i],-1,1);

/* ---------- MIDI export / import ---------- */
const GM_PROGRAMS = {lead:81,pluck:84,chord:90,pad:89,bass:38,sub:38};

function exportMidi(project, onlyId){

    const majRoot = project.key.mode==='min' ? (project.key.root+3)%12 : project.key.root;
    const map={0:0,7:1,2:2,9:3,4:4,11:5,6:6,1:-5,8:-4,3:-3,10:-2,5:-1};
    return map[majRoot];
  })();

    {t:0,o:0,bytes:[0xFF,0x03,...vlq(strBytes('SINIVURIZER').length),...strBytes('SINIVURIZER')]},
    {t:0,o:1,bytes:[0xFF,0x51,3,(us>>16)&255,(us>>8)&255,us&255]},
    {t:0,o:2,bytes:[0xFF,0x58,4,4,2,24,8]},
    {t:0,o:3,bytes:[0xFF,0x59,2,keySf&255,project.key.mode==='min'?1:0]},
    ...(project.chords||[]).map((c,i)=>({t:c.s,o:4,bytes:[0xFF,0x06,...vlq(strBytes(c.name).length),...strBytes(c.name)]}))
  ]));

    if(onlyId&&t.id!==onlyId) continue;
    const name=strBytes(t.name), ev=[{t:0,o:0,bytes:[0xFF,0x03,...vlq(name.length),...name]}];
    if(t.type==='drums'){
      const c=9, len=t.bars*16;
      for(let st=0;st<L/STEP;st++){
        const idx=st%len;
        for(const ln of t.lanes){ const v=ln.steps[idx]; if(!v) continue;
          const note=(DRUM_LANES.find(d=>d[0]===ln.id)||[0,0,36])[2], vel=clamp(Math.round(v*127),1,127);
          ev.push({t:st*STEP,o:2,bytes:[0x90|c,note,vel]},{t:st*STEP+STEP-2,o:1,bytes:[0x80|c,note,0]});
        }
      }
    } else {
      if(ch===9) ch++;
      const c=ch++%16;
      ev.push({t:0,o:1,bytes:[0xC0|c,(GM_PROGRAMS[t.role]||81)-1]});

        const p=clamp(n.p+(t.params.voice.oct||0)*12,0,127), vel=clamp(Math.round((n.v==null?0.85:n.v)*127),1,127);
        ev.push({t:n.s,o:2,bytes:[0x90|c,p,vel]},{t:n.s+Math.max(1,n.l),o:1,bytes:[0x80|c,p,0]});
      }

}
function parseMidi(buf){

  const u32=()=>{const v=d.getUint32(p); p+=4; return v;}, u16=()=>{const v=d.getUint16(p); p+=2; return v;};

        else if(on[key]){ const [s,vv]=on[key]; notes.push({p:n,s:Math.round(s*PPQ/ppq),l:Math.max(1,Math.round((t-s)*PPQ/ppq)),v:vv/127,ch:chn}); delete on[key]; }
      } else if(type===0xC0||type===0xD0) p+=1; else p+=2;

}

/* ---------- ZIP (store) ---------- */

    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);

/* ================= SINIVURIZER Synth — COMPOSER (theory + generators) ================= */
const ROMAN = ['VII','VI','V','IV','III','II','I'];
const ROMAN_IDX = {I:0,II:1,III:2,IV:3,V:4,VI:5,VII:6};
function parseNumeral(tok, mode){
  const m=tok.match(/^(b|#)?(VII|VI|IV|V|III|II|I|vii|vi|iv|v|iii|ii|i)(.*)$/);
  if(!m) return null;
  const acc=m[1]==='b'?-1:m[1]==='#'?1:0, rn=m[2], suf=m[3]||'';
  const upper=rn===rn.toUpperCase();
  const deg=ROMAN_IDX[rn.toUpperCase()];
  const scale=mode==='min'?SCALES.min:SCALES.maj;
  const off=(scale[deg]+acc+12)%12;
  let iv, q='';
  const third=upper?4:3;
  if(suf==='dim'||suf==='°'){ iv=[0,3,6]; q='dim'; }
  else if(suf==='7'){ iv=upper?[0,4,7,10]:[0,3,7,10]; q=upper?'7':'m7'; }
  else if(suf==='maj7'){ iv=upper?[0,4,7,11]:[0,3,7,11]; q=upper?'maj7':'m(maj7)'; }
  else if(suf==='9'){ iv=upper?[0,4,7,10,14]:[0,3,7,10,14]; q=upper?'9':'m9'; }
  else if(suf==='sus2'){ iv=[0,2,7]; q='sus2'; }
  else if(suf==='sus4'){ iv=[0,5,7]; q='sus4'; }
  else if(suf==='add9'){ iv=[0,third,7,14]; q=upper?'add9':'m(add9)'; }
  else if(suf==='6'){ iv=[0,third,7,9]; q=upper?'6':'m6'; }
  else { iv=[0,third,7]; q=upper?'':'m'; }
  return {off, iv, q, tok};
}
function progTonic(prog, key){
  if(prog.mode===key.mode) return key.root;
  if(prog.mode==='maj'&&key.mode==='min') return (key.root+3)%12;
  return (key.root+9)%12;
}
function progChords(prog, key){
  const tonic=progTonic(prog,key);
  return prog.ch.split('-').map(tok=>{
    const c=parseNumeral(tok,prog.mode); if(!c) return null;
    const root=(tonic+c.off)%12;
    return {root, iv:c.iv, pcs:c.iv.map(i=>(root+i)%12), name:NOTE_NAMES[root]+c.q, tok};
  }).filter(Boolean);
}
function scalePcs(key){ return (key.mode==='min'?SCALES.min:SCALES.maj).map(i=>(key.root+i)%12); }

/* voicing with voice-leading */
function voiceChord(ch, prev, lo, hi){
  lo=lo||55; hi=hi||76;
  const base=ch.iv.map(i=>i%12===i?i:i); // keep extensions
  const cands=[];
  const n=ch.iv.length;
  for(let inv=0;inv<n;inv++){
    const notes=[];
    for(let i=0;i<n;i++){ const iv=ch.iv[(i+inv)%n]+((i+inv)>=n?12:0); notes.push(iv); }
    for(let oct=2;oct<=6;oct++){
      const v=notes.map(x=>ch.root+oct*12+x).sort((a,b)=>a-b);
      if(v[0]>=lo&&v[v.length-1]<=hi+4) cands.push(v);
    }
  }
  if(!cands.length) return ch.iv.map(i=>ch.root+60+i);
  const target=prev||null;
  let best=null,bs=1e9;
  for(const v of cands){
    let s;
    if(target){ const a=[...v], b=[...target]; s=0; const m=Math.max(a.length,b.length); for(let i=0;i<m;i++) s+=Math.abs((a[Math.min(i,a.length-1)])-(b[Math.min(i,b.length-1)])); }
    else s=Math.abs(v[0]-58)+Math.abs(v[v.length-1]-70)*0.5;
    if(s<bs){bs=s;best=v;}
  }
  return best;
}

/* seeded rng */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s^=s<<13; s^=s>>>17; s^=s<<5; return ((s>>>0)%100000)/100000; }; }

function makeLanes(){ return DRUM_LANES.map(([id,name])=>({id,name,vol:id==='riser'||id==='impact'?0.6:0.8,mute:false,steps:[]})); }
function applyDrumPattern(dr, key, bars){
  const P=DRUM_PATTERNS[key]; if(!P) return;
  bars=bars||dr.bars||8; dr.bars=bars; const len=bars*16;
  dr.lanes.forEach(l=>l.steps=new Array(len).fill(0));
  const lane=id=>dr.lanes.find(l=>l.id===id);
  const val=c=>c==='X'?1:c==='x'?0.85:c==='o'?0.5:0;
  if(P.build){
    for(let b=0;b<bars;b++){
      const frac=b/bars, div=frac<0.25?4:frac<0.5?2:frac<0.75?1:0.5;
      for(let s=0;s<16;s++){
        const st=b*16+s;
        if(s%4===0 && b<bars-1) lane('kick').steps[st]=0.85;
        const every=Math.max(1,Math.round(div*4/4*4));
        const step=div>=4?16:div>=2?8:div>=1?4:(b===bars-1?1:2);
        if(s%step===0 || (div===4 && s===8)) lane('snare').steps[st]=clamp(0.35+0.6*(st/len),0.2,1);
        if(s%2===0&&b>=bars/2) lane('chat').steps[st]=0.4;
      }
    }
    lane('riser').steps[(bars-1)*16]=0.9;
    if(bars>=2) lane('riser').steps[(bars-2)*16]=0.6;
    lane('crash').steps[0]=0.8;
    return;
  }
  for(const id in P.l){
    const s=P.l[id], ln=lane(id); if(!ln) continue;
    for(let b=0;b<bars;b++) for(let i=0;i<16;i++) ln.steps[b*16+i]=val(s[i]||'.');
  }
  if(P.crash) lane('crash').steps[0]=0.85;
  if(P.impactFirst) lane('impact').steps[0]=0.8;
  if(P.fill&&bars>=4){
    const f=lane(P.fill), st=(bars-1)*16+12;
    for(let i=0;i<4;i++) f.steps[st+i]=0.5+i*0.15;
    if(P.fill==='snare') for(let i=8;i<12;i+=2) f.steps[(bars-1)*16+i]=0.45;
  }
}

    const pk=Math.min(1.2,peakOf(an)); c._pk=Math.max(pk,(c._pk||0)*0.9);
    const g=c.getContext('2d'), H=c.height, W=c.width; g.clearRect(0,0,W,H);

function saveProject(){

function openFile(e){
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  const r=new FileReader();
  if(/\.midi?$/i.test(f.name)){
    r.onload=()=>{ try{ importMidi(r.result,f.name); }catch(err){ alert('MIDI를 읽지 못했습니다: '+err.message); } };
    r.readAsArrayBuffer(f);
  } else {
    r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!p.tracks) throw new Error('형식 오류'); pushUndo(); stop(); project=p; project.tracks.forEach(t=>t._dirty=true); selId=project.tracks[0].id; rebuildChains(); refreshAll(); autosave(); toast('프로젝트를 불러왔습니다'); }catch(err){ alert('프로젝트 파일을 읽지 못했습니다: '+err.message); } };
    r.readAsText(f);
  }
}
function importMidi(buf,fname){
  const m=parseMidi(buf); const mel=m.tracks.filter(t=>!t.isDrum);
  if(!mel.length) return alert('가져올 노트가 없습니다.');
  const synths=project.tracks.filter(t=>t.type==='synth');
  const opts=h('div',null,h('h2',null,'MIDI 가져오기 — '+fname),
    h('p',{class:'guide'},'MIDI 트랙 '+mel.length+'개를 찾았습니다'+(m.bpm?' (템포 '+Math.round(m.bpm*100)/100+' BPM)':'')+'. 각 MIDI 트랙을 넣을 SINIVURIZER 트랙을 고르세요.'),
    ...mel.map((mt,i)=>h('div',{class:'field'},h('span',null,mt.name+' · 노트 '+mt.notes.length+'개'),
      h('select',{id:'mi'+i},h('option',{value:''},'(가져오지 않음)'),...synths.map((s,j)=>h('option',{value:s.id,selected:(i===0&&s.id===selId)||(i>0&&j===i)},s.name))))),
    h('label',null,h('input',{type:'checkbox',id:'miBpm',checked:!!m.bpm}),' 템포 적용 '),
    h('label',null,h('input',{type:'checkbox',id:'miRep',checked:true}),' 기존 노트 지우기'),
    h('div',{class:'btnrow'},h('button',{class:'pri',onclick:()=>{
      pushUndo(); let maxEnd=0; const rep=$('#miRep').checked, cleared=new Set();
      mel.forEach((mt,i)=>{ const id=$('#mi'+i).value; if(!id) return; const t=project.tracks.find(x=>x.id===id);
        if(rep&&!cleared.has(id)){ t.notes=[]; cleared.add(id); }
        mt.notes.forEach(n=>{ t.notes.push({p:n.p-(t.params.voice.oct||0)*12,s:n.s,l:n.l,v:n.v}); maxEnd=Math.max(maxEnd,n.s+n.l); }); touch(t); });
      if($('#miBpm').checked&&m.bpm) setBpm(Math.round(m.bpm*10)/10);
      const need=Math.ceil(maxEnd/BAR); const opts=[4,8,16,32,64]; project.bars=opts.find(b=>b>=need)||64;
      closeModal(); refreshAll(); toast('MIDI를 가져왔습니다');
    }},'가져오기'),h('button',{onclick:closeModal},'취소')));
  openModal(opts);
}

const KB_MAP={z:0,s:1,x:2,d:3,c:4,v:5,g:6,b:7,h:8,n:9,j:10,m:11,',':12,q:12,2:13,w:14,3:15,e:16,r:17,5:18,t:19,6:20,y:21,7:22,u:23,i:24,9:25,o:26,0:27,p:28};
const kbDown={};
UI.kbOct=4;
try{ UI.expert=!!localStorage.getItem('sinivurizer.expert'); }catch(e){ UI.expert=false; }
function initKeys(){
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input[type=text],input[type=number],input[type=search],textarea,select')) return;
    const k=e.key.toLowerCase(), ctrl=e.ctrlKey||e.metaKey;
    if(e.code==='Space'){ e.preventDefault(); togglePlay(); return; }
    if(ctrl&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if(ctrl&&k==='y'){ e.preventDefault(); redo(); return; }
    if(ctrl&&k==='s'){ e.preventDefault(); saveProject(); return; }
    if(e.key==='F6'){ e.preventDefault(); setWork('drum'); return; }
    if(e.key==='F7'){ e.preventDefault(); setWork('roll'); return; }
    if(e.key==='F8'){ e.preventDefault(); setWork('synth'); return; }
    if(e.key==='F9'){ e.preventDefault(); setWork('mix'); return; }
    if(e.key==='Escape'){ closeModal(); return; }
    if(UI.kb&&!ctrl&&k in KB_MAP){
      e.preventDefault(); if(kbDown[k]) return;
      const t=curTrack(); const p=(UI.kbOct+1)*12+KB_MAP[k]; kbDown[k]=p;
      liveNoteOn(t,p,0.85); recNoteOn(t,p,0.85); return;
    }
    if(UI.work==='roll') rollKey(e,k,ctrl);
  });
  document.addEventListener('keyup',e=>{
    const k=e.key.toLowerCase();
    if(kbDown[k]!=null){ const t=curTrack(); liveNoteOff(t,kbDown[k]); recNoteOff(t,kbDown[k]); delete kbDown[k]; }
  });
}
/* Web MIDI input */
function initMidiIn(){
  if(!navigator.requestMIDIAccess) return;
  navigator.requestMIDIAccess().then(acc=>{
    const bind=()=>acc.inputs.forEach(inp=>inp.onmidimessage=ev=>{
      const [st,n,v]=ev.data; const ty=st&0xF0, t=curTrack();
      if(ty===0x90&&v>0){ liveNoteOn(t,n,v/127); recNoteOn(t,n,v/127); }
      else if(ty===0x80||(ty===0x90&&v===0)){ liveNoteOff(t,n); recNoteOff(t,n); }
    });
    bind(); acc.onstatechange=bind;
    if(acc.inputs.size) toast('MIDI 건반 연결됨');
  }).catch(()=>{});
}

};
const SONG_ORDER=['intro','breakdown','build','drop','breakdown','build','drop','outro'];
UI.section='drop';
const _secCache={};
function sectionOpts(key, bars){
  key=key||UI.section; const S=SECTIONS[key]; if(!S||key==='drop') return null;
  const d=project.tracks.find(t=>t.type==='drums'); let drum=null;
  if(d&&S.drums){ drum={bars:Math.min(8,bars||project.bars),lanes:makeLanes()}; applyDrumPattern(drum,S.drums,drum.bars); }
  return {roles:new Set(S.roles),drum};
}
function setSection(k){
  UI.section=k; UI._secOpts=sectionOpts(k);
  $$('.secbar button').forEach(b=>b.classList.toggle('on',b.dataset.s===k));
  toast(SECTIONS[k].icon+' '+SECTIONS[k].label+' 미리듣기 — '+SECTIONS[k].desc);
}
function buildArrangement(order){
  order=order||SONG_ORDER;
  const P=JSON.parse(ser()); const L=project.bars; let bar=0; const segs=[];
  order.forEach(k=>{ const S=SECTIONS[k]; const sb=Math.max(L,Math.ceil(S.bars/L)*L); segs.push({k,S,start:bar,bars:sb}); bar+=sb; });
  const total=bar;
  P.tracks.forEach((t,ti)=>{
    const src=project.tracks[ti];
    if(t.type==='drums'){
      const lanes=makeLanes(); lanes.forEach(l=>{ l.steps=new Array(total*16).fill(0); const o=src.lanes.find(x=>x.id===l.id); if(o){ l.vol=o.vol; l.mute=o.mute; } });
      segs.forEach(sg=>{
        if(sg.S.roles&&!sg.S.roles.includes('drums')) return;
        let D=src; if(sg.S.drums){ D={bars:Math.min(8,sg.bars),lanes:makeLanes()}; applyDrumPattern(D,sg.S.drums,D.bars); }
        for(let b=0;b<sg.bars;b++) for(let i=0;i<16;i++) D.lanes.forEach((dl,li)=>{ const v=dl.steps[(b*16+i)%(D.bars*16)]; if(v) lanes[li].steps[(sg.start+b)*16+i]=v; });
        if(sg.k==='drop'){ const c=lanes.find(l=>l.id==='crash'), im=lanes.find(l=>l.id==='impact'); c.steps[sg.start*16]=0.9; im.steps[sg.start*16]=0.8; }
      });
      t.lanes=lanes; t.bars=total;
    } else {
      const notes=[];
      segs.forEach(sg=>{ if(sg.S.roles&&!sg.S.roles.includes(t.role)) return;
        for(let k=0;k<sg.bars/L;k++) src.notes.forEach(n=>{ if(n.s<L*BAR) notes.push({p:n.p,s:n.s+(sg.start+k*L)*BAR,l:n.l,v:n.v}); }); });
      t.notes=notes;
    }
  });
  P.chords=[]; segs.forEach(sg=>{ for(let k=0;k<sg.bars/L;k++) (project.chords||[]).forEach(c=>P.chords.push({s:c.s+(sg.start+k*L)*BAR,l:c.l,name:c.name})); });
  P.bars=total; P._segs=segs; return P;
}

function boot(){
  try{ const s=localStorage.getItem('sinivurizer.project'); if(s){ project=JSON.parse(s); if(!project.tracks||!project.tracks.length) project=null; } }catch(e){ project=null; }
  if(!project){ project=newProject(); generateFromSettings({silent:true}); }
  project.tracks.forEach(t=>{ t._dirty=true; if(t.preset&&PRESET_KO[t.preset.replace(/ \*$/,'')]) t.preset=PRESET_KO[t.preset.replace(/ \*$/,'')]; });

  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; $('#btnInstall').style.display=''; });
  $('#btnInstall').onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $('#btnInstall').style.display='none'; };
  window.addEventListener('resize',()=>resizeRoll());

}

  <li><b>빌드업</b> — 스네어 롤 가속 + 라이저로 긴장감</li><li><b>드롭</b> — 모든 트랙이 터지는 메인 (= 전체 재생)</li>
  <li><b>아웃트로</b> — 드럼·베이스로 마무리</li></ul>
  <p>내보내기의 <b>풀 곡</b>은 이 섹션들을 자동으로 이어 붙여 완성된 곡을 만듭니다.</p>`},
 {sel:'#btnOneClick',title:'🎲 원클릭 곡',body:`<p>고민될 때 누르세요! 랜덤 아티스트 스타일로 <b>루프 전체를 만들고 바로 재생</b>합니다. 마음에 들 때까지 여러 번 눌러 보세요. 이전 결과는 <kbd>Ctrl+Z</kbd>로 되돌릴 수 있어요.</p>`},
 {sel:'#rollBar',before:()=>{ setWork('roll'); },title:'✏ 피아노 롤 도구 (1/2)',body:`
  <ul><li><b>✏ 그리기</b> <kbd>P</kbd> — 빈 곳 클릭 = 노트 추가, 노트 드래그 = 이동, <b>노트 오른쪽 끝</b> 드래그 = 길이 조절</li>
  <li><b>⬚ 선택</b> <kbd>E</kbd> — 드래그로 여러 노트 선택, <kbd>Ctrl</kbd>+클릭으로 추가 선택</li>
  <li><b>⌫ 지우개</b> <kbd>D</kbd> — 클릭/드래그로 삭제</li>
  <li><b>스냅</b> — 노트가 붙는 격자 (기본 1/16 스텝)</li>
  <li><b>길이</b> — 새로 그릴 노트의 길이. 기존 노트를 클릭하면 그 길이로 자동 변경돼요 (FL Studio 방식).</li></ul>`},
 {sel:'#rollBar',title:'🧰 피아노 롤 도구 (2/2)',body:`
  <ul><li><b>👻 고스트</b> — 다른 트랙의 노트를 회색으로 표시. 코드 위에 멜로디를 쓸 때 아주 편해요.</li>
  <li><b>🎼 스케일</b> — 현재 키의 음을 밝게 표시 (왼쪽 건반에 초록 표시).</li>
  <li><b>🧲 스케일 고정</b> — 켜면 스케일 밖 음을 그려도 자동으로 맞는 음으로 보정. <b>초보자에게 강력 추천!</b></li>
  <li><b>⌨ 키보드 피아노</b> — 컴퓨터 키보드로 연주: <kbd>Z S X D C V G B H N J M</kbd> = 아래 옥타브, <kbd>Q 2 W 3 E R 5 T 6 Y 7 U I</kbd> = 위 옥타브.</li>
  <li><b>Q 퀀타이즈</b>, <b>±8va</b>(옥타브 이동), <b>스케일 맞춤</b>, <b>길이×2 / ÷2</b>, <b>레가토</b>, <b>비우기</b>, 확대/축소, <b>전체</b> 보기.</li>
  <li>버튼들은 <b>선택한 노트</b>에만, 선택이 없으면 <b>트랙 전체</b>에 적용됩니다.</li></ul>`},
 {sel:'#rollWrap',title:'🖱 피아노 롤 마우스 조작',body:`
  <ul><li><b>클릭</b> = 노트 추가 · <b>드래그</b> = 이동 · <b>끝부분 드래그</b> = 길이</li>
  <li><b>우클릭 (드래그)</b> = 삭제 (FL Studio와 동일)</li>
  <li><kbd>Shift</kbd>+드래그 = 노트 복사해서 옮기기</li>
  <li><b>맨 위 눈금자 클릭</b> = 재생 시작 위치 지정 (재생 중이면 그 위치로 점프)</li>
  <li>눈금자 아래 <b>빨간 글자</b> = 그 구간의 코드 이름</li>
  <li><b>왼쪽 건반 클릭</b> = 그 음 들어보기</li>
  <li><b>맨 아래 벨로시티</b> 영역을 드래그 = 노트 세기 조절</li>
  <li>휠 = 위아래 스크롤, <kbd>Shift</kbd>+휠 = 좌우, <kbd>Ctrl</kbd>+휠 = 확대/축소, <kbd>Alt</kbd>+드래그 = 화면 이동</li></ul>`},
 {sel:'#rollWrap',title:'⌨ 피아노 롤 단축키',body:`
  <ul><li><kbd>Ctrl+A</kbd> 전체 선택 · <kbd>Delete</kbd> 선택 삭제</li>
  <li><kbd>Ctrl+C</kbd> 복사 · <kbd>Ctrl+V</kbd> 재생 위치(마디 시작)에 붙여넣기</li>
  <li><kbd>Ctrl+B</kbd> 선택 영역을 바로 오른쪽에 복제 — 멜로디 반복할 때 최고!</li>
  <li><kbd>↑</kbd><kbd>↓</kbd> 반음 이동, <kbd>Shift</kbd>+<kbd>↑</kbd><kbd>↓</kbd> 옥타브 이동</li>
  <li><kbd>←</kbd><kbd>→</kbd> 스냅 단위로 좌우 이동</li>
  <li><kbd>Ctrl+Q</kbd> 퀀타이즈 · <kbd>Ctrl+Z</kbd> 실행 취소</li></ul>`},
 {sel:'.presetbar',before:()=>{ const s=project.tracks.find(t=>t.type==='synth'); if(s&&curTrack().type!=='synth') selectTrack(s.id); setWork('synth'); },title:'🎛 신디사이저 — 프리셋 바',body:`

  <li><b>💾 저장</b> — 내 프리셋으로 저장</li><li><b>▶ 미리듣기</b> — 역할에 맞는 음/코드를 연주</li>

 {sel:'.easy',title:'🎚 쉬운 조절 — 큰 노브 7개',body:`
  <p><b>노브 조작:</b> 위아래로 드래그 (<kbd>Shift</kbd> = 미세하게), 마우스 휠, <b>더블클릭 = 원래 값</b>.</p>

 {sel:'.modeTgl',before:()=>{ UI._tutExp=UI.expert; },title:'🔧 전문가 모드',body:`
  <p>누르면 Serum·Sylenth급 <b>전체 파라미터</b>가 나타납니다.</p>
  <ul><li><b>오실레이터 A/B</b> — 파형 10종(웨이브테이블 모핑 포함), WT 위치, 옥타브/반음/미세, 유니즌 최대 16보이스, 디튠, 블렌드, 스테레오 폭, 위상 랜덤</li>
  <li><b>파형 보기</b> — 실제 파형 그래프. <b>✏ 그리기</b>로 마우스로 직접 파형을 그려 커스텀 웨이브 제작!</li>
  <li><b>필터</b> 6종 — 그래프를 드래그: 좌우 = 컷오프, 상하 = 레조넌스</li>
  <li><b>볼륨/필터 엔벨로프</b> — 그래프의 점을 드래그해서 어택·디케이·서스테인·릴리즈</li>
  <li><b>LFO 2개</b> — 컷오프/피치/볼륨/팬을 박자에 맞춰 흔들기</li>
  <li><b>보이스/피치</b> — 폴리/모노, 글라이드, 피치 엔벨로프 · <b>이펙트</b> 9종 — 드라이브, EQ, 코러스, 딜레이, 리버브, 사이드체인</li></ul>
  <p>쉬운 노브와 전문가 파라미터는 서로 연결되어 있어 어느 쪽을 만져도 됩니다.</p>`},
 {sel:'#drumPane',before:()=>setWork('drum'),title:'🥁 드럼 시퀀서',body:`
  <ul><li><b>패턴</b> 11종(프로그레시브, 빅룸, 트랜스, 빌드업, 브레이크다운…)을 고르고 <b>패턴 적용</b></li>

  <li><b>드럼 킷</b> — 킥 음정/길이/펀치, 클랩, 햇 등 직접 튜닝 · <b>드럼 버스 이펙트</b> — 드라이브, EQ, 리버브</li>
  <li>라이저(1마디 상승 노이즈)와 임팩트도 레인으로 찍을 수 있어요.</li></ul>`},
 {sel:'#mixPane',before:()=>setWork('mix'),title:'🎚 믹서',body:`
  <ul><li>트랙마다 <b>페이더</b>(볼륨), <b>팬</b>, <b>뮤트/솔로</b>, <b>리버브·딜레이·사이드체인·저역 컷</b> 노브</li>
  <li>세로 막대 = 실시간 레벨 미터. 빨간색까지 올라가면 너무 큰 거예요.</li>
  <li>오른쪽 <b>마스터</b>: 전체 볼륨과 <b>스펙트럼 애널라이저</b>(저음~고음 분포)</li>
  <li>💡 코드/리드/플럭은 저역 컷 150~250Hz로 저음을 비워 주면 킥과 서브가 깨끗해져요.</li></ul>`},
 {sel:'#btnExport',before:()=>setWork('roll'),title:'⤓ 내보내기 (FL Studio로 가져가기)',body:`
  <ul><li><b>🎧 전체 믹스 WAV</b> — 현재 루프 (반복 횟수, 44.1/48kHz, 16/24bit 선택)</li>
  <li><b>📦 트랙별 스템 ZIP</b> — 트랙마다 WAV. FL Studio Playlist에 끌어다 놓고 믹싱</li>
  <li><b>🎼 풀 곡 WAV / MIDI / 스템</b> — 인트로→브레이크다운→빌드업→드롭→…→아웃트로 <b>자동 구성된 완성곡</b></li>
  <li><b>🎹 전체 MIDI</b> — 트랙별로 나뉜 멀티트랙 MIDI (템포·키·코드 이름 마커 포함). FL Studio에서 <kbd>Ctrl+M</kbd>으로 가져오기</li>
  <li><b>선택 트랙만</b> WAV/MIDI도 가능</li></ul>`},
 {sel:'#hint',title:'💬 안내줄',body:`<p>화면 맨 아래 줄에는 <b>마우스를 올린 곳의 설명</b>이 항상 표시됩니다. 모르는 버튼이 있으면 마우스를 올려 보세요!</p>`},
 {title:'🎵 첫 곡 만들기 레시피 (10단계)',center:true,body:`
  <ol><li><b>아티스트</b> 탭에서 좋아하는 스타일 선택 → <b>🎵 이 스타일로 루프 생성</b></li>
  <li><kbd>Space</kbd>로 들어 보고, 마음에 안 들면 <b>🎲 다른 버전</b></li>

  <li><kbd>Ctrl+A</kbd> → <kbd>Ctrl+B</kbd>로 멜로디 반복, 뒷부분만 살짝 바꿔 변주</li>
  <li><b>신디사이저</b> 탭에서 큰 노브로 사운드 다듬기 (밝기·두께·공간감)</li>
  <li><b>드럼</b> 탭에서 패턴 고르기, 마지막 마디에 필 넣기</li>
  <li><b>믹서</b>에서 볼륨 밸런스 (리드가 가장 잘 들리게)</li>
  <li><b>섹션</b> 버튼으로 브레이크다운·빌드업·드롭을 들어보며 확인</li>
  <li><b>⤓ 내보내기 → 🎼 풀 곡 WAV</b> 또는 스템/MIDI로 FL Studio에서 마무리!</li></ol>`},
 {title:'🎉 튜토리얼 완료!',center:true,last:true,body:`
  <p>이제 SINIVURIZER Synth의 모든 기능을 알게 되었어요. 바로 시작해 볼까요?</p>
  <p style="color:var(--dim)">튜토리얼은 상단 <b>?</b> → <b>📖 튜토리얼 다시 보기</b>에서 언제든 다시 볼 수 있습니다.</p>`}
];
const TUT={i:0,on:false};
function startTutorial(){
  closeModal(); TUT.on=true; TUT.i=0;
  if(!$('#tutSpot')){
    document.body.append(h('div',{id:'tutSpot'}),h('div',{id:'tutCard'}));
    window.addEventListener('resize',()=>TUT.on&&placeTut());
    document.addEventListener('keydown',e=>{
      if(!TUT.on) return;
      if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); e.stopImmediatePropagation(); tutGo(1); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); e.stopImmediatePropagation(); tutGo(-1); }
      else if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); endTutorial(); }
    },true);
  }
  $('#tutSpot').style.display=''; $('#tutCard').style.display='';
  showTut();
}
function tutGo(d){ const n=TUT.i+d; if(n<0) return; if(n>=TUT_STEPS.length) return endTutorial(); TUT.i=n; showTut(); }
function tutTarget(st){ if(!st.sel) return null; const el=typeof st.sel==='function'?st.sel():$(st.sel); return el&&el.getBoundingClientRect().width?el:null; }
function showTut(){
  const st=TUT_STEPS[TUT.i];
  try{ st.before&&st.before(); }catch(e){ console.warn(e); }
  const C=$('#tutCard'), n=TUT_STEPS.length;
  C.innerHTML='';
  C.append(...[
    h('div',{class:'tutProg'},h('div',{style:'width:'+((TUT.i+1)/n*100)+'%'})),
    h('div',{class:'tutHead'},h('span',{class:'tutNum'},(TUT.i+1)+' / '+n),h('button',{class:'sm',onclick:endTutorial,'data-hint':'튜토리얼 끝내기 (Esc)'},'✕ 건너뛰기')),
    h('h3',null,st.title),
    h('div',{class:'tutBody',html:st.body}),
    st.last?h('div',{class:'bigbtns',style:'grid-template-columns:1fr 1fr 1fr;margin:10px 0 4px'},
      h('button',{class:'pri',onclick:()=>{ endTutorial(); oneClickSong(); }},'🎲 원클릭 곡',h('small',null,'바로 듣기')),
      h('button',{class:'red',onclick:()=>{ endTutorial(); setBTab('artist'); $('#body').classList.remove('nobrowser'); }},'🎤 아티스트',h('small',null,'스타일 고르기')),
      h('button',{onclick:()=>{ endTutorial(); startNew(true); }},'🆕 빈 프로젝트',h('small',null,'처음부터 직접'))):null,
    h('div',{class:'tutNav'},
      h('button',{onclick:()=>tutGo(-1),disabled:TUT.i===0},'← 이전'),
      h('button',{class:'pri',onclick:()=>tutGo(1)},st.last?'완료 ✓':'다음 →'))
  ].filter(Boolean));
  setTimeout(placeTut,80);
}
function placeTut(){
  const st=TUT_STEPS[TUT.i], S=$('#tutSpot'), C=$('#tutCard'), el=tutTarget(st);
  const W=innerWidth, H=innerHeight, cw=Math.min(430,W-20); C.style.width=cw+'px';
  const ch=C.offsetHeight;
  if(!el||st.center){
    S.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0;`;
    C.style.left=(W-cw)/2+'px'; C.style.top=Math.max(10,(H-ch)/2)+'px'; return;
  }
  const r=el.getBoundingClientRect(), pad=6;
  S.style.cssText=`left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px;`;
  const gap=16; let x,y;
  if(r.right+gap+cw<W){ x=r.right+gap; y=r.top; }
  else if(r.left-gap-cw>0){ x=r.left-gap-cw; y=r.top; }
  else if(r.bottom+gap+ch<H){ x=r.left; y=r.bottom+gap; }
  else if(r.top-gap-ch>0){ x=r.left; y=r.top-gap-ch; }
  else { x=W-cw-16; y=H-ch-16; }
  C.style.left=clamp(x,10,W-cw-10)+'px'; C.style.top=clamp(y,10,Math.max(10,H-ch-10))+'px';
}
function endTutorial(){
  TUT.on=false; if($('#tutSpot')){ $('#tutSpot').style.display='none'; $('#tutCard').style.display='none'; }
  try{ localStorage.setItem('sinivurizer.welcomed','1'); localStorage.setItem('sinivurizer.tutorial','1'); }catch(e){}
  setWork('roll'); toast('튜토리얼 종료 — 상단 ? 버튼에서 언제든 다시 볼 수 있어요');
}

UI.artist='Martin Garrix';
boot();
