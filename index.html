<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINIVURIZER — 코드 & 보이싱 랩</title><meta name="theme-color" content="#07090a">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<style>:root{--bg:#07090a;--p1:#0e1214;--p2:#141a1d;--p3:#1c2428;--ln:#222b30;--ln2:#2e3a40;--tx:#e3efe7;--dim:#7a8a81;--acc:#39ff6a;--red:#ff2d55;--font:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.4 var(--font);overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--p3);border:1px solid var(--ln2);border-radius:4px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4a5a62;background:#243035}
button.on{background:var(--acc);color:#03130a;border-color:var(--acc);font-weight:700;box-shadow:0 0 8px rgba(57,255,106,.45)}
button.pri{background:linear-gradient(#5dff86,#1fd94f);color:#03130a;border-color:var(--acc);font-weight:800;box-shadow:0 0 10px rgba(57,255,106,.4)}
button.red{background:linear-gradient(#ff5577,#e0123d);color:#fff;border-color:var(--red);font-weight:800;box-shadow:0 0 10px rgba(255,45,85,.4)}
button.sm{padding:2px 7px;font-size:11px}button.icon{width:30px;height:28px;padding:0;font-size:13px}
select,input[type=number],input[type=search],input[type=text],textarea{background:#05080a;border:1px solid var(--ln2);border-radius:4px;padding:3px 6px;outline:none}
textarea{width:100%;resize:vertical}select:focus,input:focus,textarea:focus{border-color:var(--acc)}
input[type=range]{accent-color:var(--acc)}kbd{background:#000;border:1px solid #333;border-radius:3px;padding:0 4px;font:10px Consolas,monospace;color:var(--acc)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#06090a}::-webkit-scrollbar-thumb{background:#26323a;border-radius:5px}
#app{display:grid;grid-template-rows:48px 1fr 22px;height:100vh}
#top{display:flex;align-items:center;gap:7px;padding:0 8px;background:linear-gradient(#111618,#080b0c);border-bottom:1px solid rgba(57,255,106,.25);box-shadow:0 1px 14px rgba(57,255,106,.1);overflow-x:auto;overflow-y:hidden}
#logo{font-weight:900;letter-spacing:1px;font-size:14px;background:linear-gradient(90deg,#39ff6a,#c8ff3a 45%,#ff2d55);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;filter:drop-shadow(0 0 6px rgba(57,255,106,.4))}
#logo small{display:block;font-size:9px;letter-spacing:2px;-webkit-text-fill-color:var(--dim);font-weight:700}
#views{display:flex;gap:2px}#views button{background:transparent;border-color:transparent;color:var(--dim);font-weight:700}#views button.on{background:#0f2416;color:var(--acc);border-color:rgba(57,255,106,.4);box-shadow:none}
.grp{display:flex;align-items:center;gap:4px;padding:3px 6px;background:#05080a;border:1px solid #11181b;border-radius:6px;white-space:nowrap}.grp label{color:var(--dim);font-size:11px}
#pos{font:700 13px Consolas,monospace;color:var(--acc);text-shadow:0 0 6px var(--acc);min-width:58px;text-align:center}
#bpm{width:52px;color:var(--red);font-weight:800;text-align:center}#keyRoot{width:62px}
#btnPlay.on{background:var(--acc);color:#03130a}.sp{flex:1}
main{position:relative;min-height:0}.view{position:absolute;inset:0;display:none}.view.on{display:grid}
#v-lab{grid-template-columns:290px 1fr 340px}
#left,#right{background:var(--p1);border-right:1px solid #000;display:flex;flex-direction:column;min-height:0}
#right{border-left:1px solid #000;overflow:auto;display:block;padding:8px}
.tabs{display:flex;gap:2px;padding:6px 6px 0;background:#0a0d0f;border-bottom:1px solid var(--ln)}.tabs button{border-radius:5px 5px 0 0;background:transparent;border-color:transparent;color:var(--dim);padding:5px 8px;font-size:11.5px}
.tabs button.on{background:var(--p1);color:var(--acc);border-color:var(--ln);box-shadow:none}
#lpane{flex:1;overflow:auto;padding:8px}
h4{margin:10px 0 5px;color:var(--red);font-size:11.5px;letter-spacing:.3px}h4 small{color:var(--dim);font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.pc{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;text-align:left;padding:5px 7px;background:#0b1012;border-left:3px solid var(--fc)}
.pc:hover{background:#13201a}.pc .rn{color:var(--fc);font-weight:800;font-size:11px;min-width:34px}.pc .cn{font-weight:700}.pc .sb{color:var(--dim);font-size:10px}
.seg{display:flex;gap:3px}.seg button{flex:1}
.list{display:flex;flex-direction:column;gap:4px;margin-top:6px}.item{padding:6px 8px;background:#0b1012;border:1px solid #141c20;border-radius:5px}
.item .row{display:flex;align-items:center;gap:5px}.cnames{color:var(--acc);font-weight:700;font-size:11.5px;margin-top:2px}.sub{color:var(--dim);font-size:10.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.chip{padding:2px 8px;border-radius:10px;background:#0b1012;border:1px solid var(--ln2);cursor:pointer;font-size:11px;color:var(--dim)}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.card{background:#0b1012;border:1px solid var(--ln2);border-radius:6px;padding:8px;margin-bottom:6px}
.sug{display:grid;grid-template-columns:52px 70px 1fr 38px;align-items:center;gap:6px;padding:6px;border-radius:5px;cursor:pointer}.sug:hover{background:#13201a}
.sug .rn{font-weight:800}.sug .bar{height:8px;background:#141c20;border-radius:4px;overflow:hidden}.sug .bar div{height:100%}.sug .pct{text-align:right;color:var(--dim)}
.guide{color:#b9cabf;font-size:11.5px}.guide li{margin:2px 0}.btnrow{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
#center{display:flex;flex-direction:column;min-width:0;min-height:0;padding:8px 10px;gap:6px;overflow:auto}
.chead{display:flex;align-items:center;gap:10px;color:var(--dim)}.chead b{color:var(--tx);font-size:12.5px}.hintline{font-size:10.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
#timeline{display:flex;gap:6px;flex-wrap:wrap;min-height:96px}
.slot{flex:1 1 0;min-width:96px;background:linear-gradient(#10171a,#0a0e10);border:1px solid #1b2428;border-top:3px solid var(--fc);border-radius:6px;padding:6px 8px;cursor:pointer;position:relative}
.slot:hover{border-color:#34444b}.slot.sel{border-color:var(--acc);box-shadow:0 0 14px rgba(57,255,106,.3),inset 0 0 0 1px rgba(57,255,106,.3)}
.srn{color:var(--fc);font-weight:800;font-size:11px}.sname{font-size:19px;font-weight:900;letter-spacing:-.3px}.snotes{color:var(--dim);font-size:10px;font-family:Consolas,monospace;min-height:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sfoot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;color:var(--dim);font-size:10.5px}.sbtn{display:flex;gap:2px;opacity:.35}.slot:hover .sbtn,.slot.sel .sbtn{opacity:1}.sbtn button{padding:0 5px;font-size:10px}
.empty{color:var(--dim);padding:20px;border:1px dashed var(--ln2);border-radius:6px;width:100%;text-align:center}
#map{width:100%;height:300px;flex:none;border:1px solid #11181b;border-radius:6px}#keys{width:100%;height:110px;flex:none;border-radius:6px}
#right section{background:linear-gradient(#0f1416,#0a0e10);border:1px solid #182126;border-radius:7px;padding:8px;margin-bottom:8px}
#right h3{margin:0 0 7px;font-size:12.5px;color:var(--acc);text-shadow:0 0 6px rgba(57,255,106,.35)}
.vlist{display:flex;flex-direction:column;gap:3px;max-height:250px;overflow:auto;margin-bottom:6px}
.vopt{padding:5px 7px;border:1px solid #182126;border-radius:5px;cursor:pointer;background:#090d0f}.vopt b{display:block;font-size:11.5px}.vopt span{display:block;color:var(--dim);font-size:10.5px;line-height:1.35}
.vopt:hover{border-color:#34444b}.vopt.on{border-color:var(--acc);background:#0d2014}.vopt.on b{color:var(--acc)}
.frow{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:6px;margin:4px 0}.frow span{color:var(--dim);font-size:11px}.frow b{color:var(--acc);font-size:11px;min-width:44px;text-align:right;font-family:Consolas,monospace}
.frow select{width:100%}.chk{display:flex;align-items:center;gap:4px;color:#b9cabf;font-size:11px;margin:4px 0;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11px}.kv span{color:var(--dim)}
#v-roll{grid-template-rows:auto 1fr}
.toolbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--p1);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.toolbar .tool{display:flex;flex-direction:column;align-items:center;padding:2px 7px;min-width:34px;font-size:14px;line-height:1.1}.toolbar .tool small{font-size:9px;color:var(--dim)}.toolbar .tool.on small{color:#03130a}
.toolbar .sep{width:1px;height:22px;background:var(--ln2);margin:0 4px}.toolbar .lbl{color:var(--dim)}
.syncTag{font-size:11px;padding:2px 8px;border-radius:10px}.syncTag.ok{color:var(--acc);border:1px solid rgba(57,255,106,.4)}.syncTag.man{color:var(--red);border:1px solid rgba(255,45,85,.5)}
#rollWrap{position:relative;min-height:0;overflow:hidden}#roll,#rollPH{position:absolute;left:0;top:0}#rollPH{pointer-events:none}
.guide.view{grid-template-columns:300px 1fr}
.gtoc{background:var(--p1);border-right:1px solid #000;overflow:auto;padding:10px}.gtoc input{width:100%;margin:8px 0}
.gtitle{font-weight:900;font-size:15px;color:var(--acc);text-shadow:0 0 8px rgba(57,255,106,.4)}.gtitle small{display:block;font-size:11px;color:var(--dim);font-weight:400;text-shadow:none;margin-top:3px}
.ggrp{color:var(--red);font-weight:800;font-size:11px;margin:12px 0 4px;letter-spacing:.5px}.gitem{padding:5px 8px;border-radius:4px;cursor:pointer;color:#c3d3c9}.gitem:hover{background:#13201a}.gitem.on{background:#0f2416;color:var(--acc);font-weight:700}
.gbody{overflow:auto;padding:22px 34px 60px;max-width:980px;font-size:13.5px;line-height:1.75;color:#d3e2d8}
.gbody h2{font-size:24px;margin:2px 0 10px;color:#fff}.gbody h3{color:var(--acc);margin:22px 0 6px;font-size:15px}.gcat{color:var(--red);font-weight:800;font-size:11.5px;letter-spacing:1px}
.gbody .lead{font-size:14.5px;color:#fff;border-left:3px solid var(--acc);padding-left:12px}
.gbody table{border-collapse:collapse;width:100%;margin:10px 0;font-size:12.5px}.gbody th{background:#0f2416;color:var(--acc);text-align:left;padding:6px 8px;border:1px solid #1d2a24}.gbody td{padding:6px 8px;border:1px solid #1a2226}
.gbody li{margin:3px 0}.gbody b{color:#fff}
.tipbox{background:#0c1d12;border:1px solid rgba(57,255,106,.4);border-radius:6px;padding:9px 12px;margin:12px 0}.warnbox{background:#200a10;border:1px solid rgba(255,45,85,.5);border-radius:6px;padding:9px 12px;margin:12px 0}
.gnav{display:flex;justify-content:space-between;margin-top:30px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}#modal.on{display:flex}
#modal .box{background:var(--p1);border:1px solid rgba(57,255,106,.4);border-radius:10px;padding:16px 18px;max-width:880px;width:92vw;max-height:88vh;overflow:auto;box-shadow:0 20px 60px #000}
#modal h2{margin:0 0 8px;color:var(--acc);font-size:17px}#modal .frow{grid-template-columns:150px 1fr 60px}
.vcmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0}.vc{background:#0a0e10;border:1px solid #1b2428;border-radius:6px;padding:8px}.vc.on{border-color:var(--acc)}.vn{font:11px Consolas,monospace;color:var(--dim);margin:4px 0}
#hint{display:flex;align-items:center;padding:0 10px;background:#05080a;border-top:1px solid #0d1315;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden}#hint b{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);background:#06110a;border:1px solid var(--acc);padding:7px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70;box-shadow:0 0 18px rgba(57,255,106,.3)}#toast.on{opacity:1}
#tutSpot{position:fixed;z-index:90;border:2px solid var(--acc);border-radius:9px;box-shadow:0 0 0 9999px rgba(0,0,0,.74),0 0 22px rgba(57,255,106,.7);pointer-events:none;transition:all .28s}
#tutCard{position:fixed;z-index:91;background:linear-gradient(#131a16,#0a0d0b);border:1px solid var(--acc);border-radius:12px;padding:12px 16px 14px;box-shadow:0 18px 60px #000;max-height:calc(100vh - 20px);overflow:auto;transition:left .28s,top .28s}
#tutCard h3{margin:4px 0 8px;font-size:16px;color:var(--acc)}#tutCard .tb{font-size:12.5px;line-height:1.6;color:#d3e2d8}#tutCard .tb b{color:#fff}#tutCard ul{padding-left:18px;margin:6px 0}
.tprog{height:4px;background:#1b2420;border-radius:2px;overflow:hidden}.tprog div{height:100%;background:linear-gradient(90deg,var(--acc),var(--red))}
.thead{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.tnum{color:var(--red);font-weight:800;font-family:Consolas,monospace}.tnav{display:flex;justify-content:space-between;margin-top:12px}
#sound{width:118px}#rhythm{width:150px}#arp{width:118px}#bassStyle{width:100px}#keyMode{width:66px}
#views button kbd{display:none}
@media (max-width:1700px){#logo small{display:none}#views button{padding:4px 6px}}
#app{grid-template-rows:auto 1fr 22px}
#top{flex-wrap:wrap;overflow:visible;padding:5px 8px;row-gap:5px;min-height:48px}
.pc .rn{white-space:nowrap;font-size:10px;overflow:hidden;text-overflow:ellipsis;max-width:62px}
</style></head><body>
<div id="app">
<header id="top">
 <div id="logo" data-hint="SINIVURIZER — 멜로딕 프로그레시브 하우스 코드 진행 & 보이싱 전문 툴">SINIVURIZER<small>코드 &amp; 보이싱 랩</small></div>
 <nav id="views">
  <button data-v="lab" class="on" data-hint="코드 진행 & 보이싱 랩">🎹 보이싱 랩</button>
  <button data-v="roll" data-hint="피아노 롤 (F7) — FL Studio와 같은 조작">🎼 피아노 롤 <kbd>F7</kbd></button>
  <button data-v="gs" data-hint="Sylenth1 · Serum 2 사운드 메이킹 가이드북">📘 사운드 가이드북</button>
  <button data-v="gm" data-hint="FL Studio 믹싱 · 마스터링 가이드북">📗 믹싱·마스터링</button>
 </nav>
 <div class="grp">
  <button id="btnPlay" class="icon" data-hint="재생/정지 <b>Space</b> · 일시정지 <b>Ctrl+Space</b>">▶</button><button id="btnStop" class="icon" data-hint="정지 후 처음으로">■</button><span id="pos">1:1:1</span>
 </div>
 <div class="grp"><label>키</label><select id="keyRoot"></select><select id="keyMode"><option value="min">마이너</option><option value="maj">메이저</option></select>
  <label>템포</label><input id="bpm" type="number" min="60" max="200"></div>
 <div class="grp"><select id="sound" data-hint="미리듣기 사운드"></select><select id="rhythm" data-hint="코드 주법 (리듬) — 피아노 롤 노트에 반영"></select><select id="arp" data-hint="아르페지오 (오른손)"></select>
  <button id="btnKick" class="sm" data-hint="킥 + 사이드체인 펌핑으로 실제 곡처럼 듣기">킥</button><button id="btnBass" class="sm" data-hint="베이스(루트) 함께 듣기 · MIDI에 베이스 트랙">베이스</button><select id="bassStyle"></select></div>
 <div class="sp"></div>
 <div class="grp"><button id="btnUndo" class="sm" data-hint="한 단계 실행 취소 <b>Ctrl+Alt+Z</b> (Ctrl+Z = 마지막 편집 토글, FL Studio 방식)">↶</button><button id="btnRedo" class="sm" data-hint="다시 실행">↷</button>
  <button id="btnNew" class="sm" data-hint="완전 새로 시작">새로</button><button id="btnOpen" class="sm" data-hint="프로젝트(.sinv.json) 또는 MIDI 열기 <b>Ctrl+M</b>">열기</button><button id="btnSave" class="sm" data-hint="저장 <b>Ctrl+S</b>">저장</button>
  <button id="btnExport" class="pri" data-hint="MIDI 내보내기 <b>Ctrl+E</b>">⤓ MIDI</button><button id="btnHelp" class="sm" data-hint="튜토리얼 <b>F1</b>">?</button></div>
 <input type="file" id="fileIn" accept=".json,.sinv,.mid,.midi" style="display:none">
</header>
<main>
 <section class="view on" id="v-lab">
  <aside id="left"><div class="tabs" id="ltabs"><button data-t="pal" class="on">팔레트</button><button data-t="lib">진행 라이브러리</button><button data-t="sug">다음 코드 추천</button><button data-t="txt">직접 입력</button></div><div id="lpane"></div></aside>
  <div id="center">
   <div class="chead"><b>코드 진행</b><span id="tlInfo"></span><span class="sp"></span><span class="hintline">← → 선택 · ↑ ↓ 탑노트 · Delete 삭제 · Ctrl+B 복제 · 1~7 다이어토닉 추가</span></div>
   <div id="timeline"></div>
   <div class="chead"><b>보이싱 맵</b><span class="legend"><i style="background:#ff2d55"></i>왼손 <i style="background:#39ff6a"></i>오른손 · 색 = 벨로시티 (초록 약 → 빨강 강) · 실선 = 공통음 유지</span></div>
   <canvas id="map"></canvas>
   <div class="chead"><b>선택 코드 건반</b></div>
   <canvas id="keys"></canvas>
  </div>
  <aside id="right"></aside>
 </section>
 <section class="view" id="v-roll"><div class="toolbar" id="rollBar"></div><div id="rollWrap"><canvas id="roll"></canvas><canvas id="rollPH"></canvas></div></section>
 <section class="view guide" id="v-gs"></section>
 <section class="view guide" id="v-gm"></section>
</main>
<footer id="hint"><span id="hintText">SINIVURIZER 코드 &amp; 보이싱 랩 — 마우스를 올리면 설명이 여기에 표시됩니다. <b>F1</b> 튜토리얼</span></footer>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div><div id="toast"></div>
<script>const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES = {'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'};
const SCALES = {
  maj:[0,2,4,5,7,9,11], min:[0,2,3,5,7,8,10], dor:[0,2,3,5,7,9,10],
  harm:[0,2,3,5,7,8,11], mixo:[0,2,4,5,7,9,10], penta:[0,3,5,7,10]
};

/* 멜로딕 프로그레시브 하우스에서 자주 쓰이는 키 (★ = 사용 빈도) */
const KEY_LIST = [
  {root:6, mode:'min', pop:5, tip:'페스티벌·멜로딕 프로그레시브 하우스에서 가장 흔한 키 중 하나. 리드가 시원하게 뻗는 음역.'},
  {root:9, mode:'min', pop:5, tip:'감성 마이너의 정석. 피아노·플럭으로 쓰기 쉬움.'},
  {root:5, mode:'min', pop:5, tip:'두껍고 어두운 드롭. 서브베이스가 단단하게 들리는 키.'},
  {root:7, mode:'min', pop:4, tip:'유포릭 + 에픽. 빌드업 긴장감이 좋음.'},
  {root:1, mode:'min', pop:4, tip:'애절한 탑라인. 보컬 프로그레시브에 많이 쓰임.'},
  {root:8, mode:'min', pop:4, tip:'밝은 듯 슬픈 감성. 업리프팅 계열.'},

/* 오른손 후보 생성 + 점수 */
function rhCandidates(pcsRel, root, st, opts){
  const pcs=pcsRel.map(x=>pcOf(root+x)); const n=pcs.length; if(!n) return [[]];
  const perms=[]; const permute=(a,l)=>{ if(l===a.length){ perms.push(a.slice()); return; } for(let i=l;i<a.length;i++){ [a[l],a[i]]=[a[i],a[l]]; permute(a,l+1); [a[l],a[i]]=[a[i],a[l]]; } };

  const spanMul=opts.width;

    for(let cb=0;cb<combos;cb++){
      for(let base=lo-12;base<=lo+12;base++){
        if(pcOf(base)!==pm[0]) continue;
        const v=[base]; let ok=true;

        if(st.topDouble) vv.push(vv[vv.length-1]-12>=vv[0]?vv[vv.length-1]+12:vv[vv.length-1]+12);
        const span=vv[vv.length-1]-vv[0];
        if(span<st.span[0]*spanMul-2||span>st.span[1]*spanMul+3) ok=false;
        if(ok) out.push(vv);

    }
  }

}
function vlDist(a,b){

}

function voiceProgression(slots, key, V){
  const st=VOICINGS[V.style]||VOICINGS.proWide; let prevRH=null; const out=[];
  slots.forEach((sl,i)=>{
    const q=QUAL[sl.q]; const root=key.root+sl.r;
    const c={iv:q.iv};
    // LH
    let lh=[];
    if(V.bassMode!=='none'){
      const bassPc=pcOf(root+(sl.bass!=null?sl.bass-sl.r:0));
      let b=36+V.lhReg; while(pcOf(b)!==bassPc) b++; if(b>47+V.lhReg) b-=12;
      const lhIv=typeof st.lh==='function'?st.lh(c):st.lh;
      lh=lhIv.map(x=>typeof x==='function'?b+x(c):b+x);
      if(sl.bass!=null&&pcOf(sl.bass)!==pcOf(sl.r)) lh=[b]; // 슬래시 코드는 베이스 단음
      if(V.bassMode==='root') lh=[b];
    }
    // RH
    let pcsRel=st.rh(c);
    const opts={reg:V.reg+(sl.oct||0)*12,width:V.width};
    let cands=rhCandidates(pcsRel,root,st,opts);
    if(!cands.length) cands=rhCandidates(pcsRel,root,Object.assign({},st,{span:[0,40]}),opts);
    const lhTop=lh.length?Math.max(...lh):0;
    let best=cands[0]||[], bs=1e9;
    const targetTop=sl.top!=null?sl.top:null;
    const center=((st.range[0]+st.range[1])/2)+opts.reg;
    for(const v of cands){
      const top=v[v.length-1];
      let s=0;
      s+=V.lead*vlDist(v,prevRH)*1.0;
      s+=Math.abs((v[0]+top)/2-center)*0.6;
      s+=roughness([...lh,...v])*1.2;
      if(lh.length&&v[0]-lhTop<3) s+=12;
      if(targetTop!=null) s+=Math.abs(top-targetTop)*(pcOf(top)===pcOf(targetTop)?2:12);
      if(V.topLine==='rise'&&prevRH) s+=top<prevRH[prevRH.length-1]?6:0;
      if(V.topLine==='fall'&&prevRH) s+=top>prevRH[prevRH.length-1]?6:0;
      if(V.topLine==='steady'&&prevRH) s+=Math.abs(top-prevRH[prevRH.length-1])*1.5;
      // 3도는 탑에 두지 않는 편이 덜 달다 (선택)
      if(V.avoidThirdTop&&pcOf(top-root)===third(c)&&!st.topDouble) s+=3;

      if(sl.inv!=null&&sl.inv!=='auto'){ const bottom=pcOf(v[0]-root); const want=[0,third(c),7][sl.inv]; if(bottom!==want) s+=40; }
      if(s<bs){ bs=s; best=v; }
    }
    prevRH=best;
    const notes=[...lh.map(p=>({p,role:'lh'})),...best.map((p,j)=>({p,role:j===best.length-1?'top':'rh'}))];
    out.push({lh,rh:best,notes,name:chordName(root,sl.q,sl.bass!=null?key.root+sl.bass:null)});
  });
  return out;
}

/* note: {s,l,p,role,idx(chord index),pos(16th in bar)} → v(1~127), off(ticks) */
function humanize(notes, V, nChords, seed){
  const R=rng(seed||7);
  const range=V.hi-V.lo;
  notes.forEach(n=>{
    let x=0.62;
    // 박 강세: 1박 > 3박 > 2·4박 > 8분 > 16분
    const pos=n.pos%16;
    const beatW = pos===0?1:pos===8?0.6:pos%4===0?0.3:pos%2===0?0.05:-0.25;
    x+=V.beat*beatW*(V.beat<0&&pos%4===2?-2.2:1);
    // 프레이즈 아크: 4코드 단위로 2~3번째 코드에 정점, 마지막은 해결감 있게 약간 내려감
    const ph=(n.idx%4)/3; x+=V.phrase*(Math.sin(ph*Math.PI*0.9)-0.3);
    if(n.idx%4===0&&n.first) x+=V.first;
    if(V.cresc) x=0.15+0.85*(n.s/Math.max(1,n.total));
    // 보이스별: 탑노트(멜로디) 강조, 내성 약하게, 베이스는 살짝 강하게
    if(n.role==='top') x+=V.top; else if(n.role==='rh') x-=V.inner*(0.6+0.4*R()); else if(n.role==='lh') x+=V.bass;
    // 휴머나이즈 (정규분포)
    x+=gauss(R)*V.human;
    n.v=Math.round(clamp(V.lo+range*clamp(x,0,1),1,127));
    // 타이밍: 롤(아래→위로 살짝 펼치기) + 미세 흔들림 (ms → tick)
    n.off=(n.rollIdx||0)*V.roll/1000+gauss(R)*V.timing/1000;
  });
  return notes;
}

function vlq(n){ const b=[n&127]; while((n>>=7)) b.unshift((n&127)|128); return b; }

function mtrk(events){ events.sort((a,b)=>a.t-b.t||a.o-b.o); const out=[]; let last=0;

  let t=0; state.slots.forEach((sl,i)=>{ const nm=voiced[i].name; meta.push({t,o:3,b:[0xFF,0x06,...vlq(enc(nm).length),...enc(nm)]}); t+=sl.beats*PPQ; });
  const tracks=[mtrk(meta)];
  const mk=(name,list,ch)=>{ const e=[{t:0,o:0,b:[0xFF,0x03,...vlq(enc(name).length),...enc(name)]}];
    list.forEach(n=>{ const s=Math.max(0,n.s+(opts.timing&&n.off?n.off*tickPerSec:0)); e.push({t:s,o:2,b:[0x90|ch,clamp(n.p,0,127),clamp(n.v,1,127)]},{t:s+Math.max(2,n.l),o:1,b:[0x80|ch,clamp(n.p,0,127),0]}); }); return mtrk(e); };
  if(opts.split){ tracks.push(mk('Chords LH (왼손)',ev.filter(n=>n.role==='lh'),0)); tracks.push(mk('Chords RH (오른손)',ev.filter(n=>n.role!=='lh'),1)); }
  else tracks.push(mk('Chords (보이싱)',ev,0));
  if(opts.bass) tracks.push(mk('Bass (루트)',bassEvents(state,voiced),2));
  const hdr=[...enc('MThd'),0,0,0,6,0,1,0,tracks.length,0,PPQ];
  return new Uint8Array([...hdr,...tracks.flat()]);
}

function play(){
  ensureAudio(); if(T.playing) return; T.playing=true; ui_playState();
  T.anchorTime=A.ctx.currentTime+0.06; T.anchorTick=T.startTick; T.last=T.startTick;
  const sched=()=>{
    const L=songLen(), td=tickSec(); const T1=T.anchorTick+(A.ctx.currentTime+0.15-T.anchorTime)/td;
    const t0=T.last; if(T1<=t0) return; T.last=T1;

    const occ=(s)=>{ const k=Math.ceil((t0-s)/L); const a=s+k*L; return a<T1&&a>=t0?a:null; };
    for(const n of S.notes){ if(n.m) continue; const a=occ(n.s); if(a!=null) playNote(n.p,timeOf(a),n.l*td,n.v); }
    if(S.bassOn) for(const b of S._bass||[]){ const a=occ(b.s); if(a!=null) playBass(b.p,timeOf(a),b.l*td,b.v); }

function quickChop(){ pushUndo(); const s=R.snap||24; const out=[]; targets().forEach(n=>{ if(n.l<=s) return; let t=n.s; const end=n.s+n.l; n.l=s; t+=s; while(t<end){ out.push({...n,s:t,l:Math.min(s,end-t)}); t+=s; } }); S.notes.push(...out); edited(); rDraw(); toast('퀵 찹'); }
function glue(){ pushUndo(); const ns=[...targets()].sort((a,b)=>a.p-b.p||a.s-b.s); for(let i=1;i<ns.length;i++){ const a=ns[i-1], b=ns[i]; if(a.p===b.p&&Math.abs(a.s+a.l-b.s)<=2&&S.notes.includes(a)){ a.l=b.s+b.l-a.s; S.notes.splice(S.notes.indexOf(b),1); R.sel.delete(b); ns[i]=a; } } edited(); rDraw(); toast('글루 (붙이기)'); }
function dupRight(){ const ns=[...R.sel]; if(!ns.length) return toast('먼저 노트를 선택하세요 (Ctrl+A)'); pushUndo(); const s0=Math.min(...ns.map(n=>n.s)), e0=Math.max(...ns.map(n=>n.s+n.l)); const len=Math.ceil((e0-s0)/(R.snap||24))*(R.snap||24);
  const cp=ns.map(n=>({...n,s:n.s+len})); S.notes.push(...cp); R.sel=new Set(cp); edited(); rDraw(); }
function insertSpace(del){ const ns=[...R.sel]; if(!ns.length) return; pushUndo(); const s0=Math.min(...ns.map(n=>n.s)), e0=Math.max(...ns.map(n=>n.s+n.l)), len=e0-s0;
  if(del){ S.notes=S.notes.filter(n=>!(n.s>=s0&&n.s<e0)); S.notes.forEach(n=>{ if(n.s>=e0) n.s-=len; }); R.sel.clear(); } else S.notes.forEach(n=>{ if(n.s>=s0&&!R.sel.has(n)) n.s+=len; });
  edited(); rDraw(); }
/* ---------- 도구 창 (FL Studio 스타일 대화상자) ---------- */
function dlg(title, fields, onApply, desc){
  const vals={}; const box=h('div',null,h('h2',null,title),desc?h('p',{class:'guide'},desc):null);
  const prev=()=>onApply(vals,true);
  fields.forEach(f=>{ vals[f.k]=f.v;
    const out=h('b',{style:'min-width:46px;text-align:right;color:var(--acc)'},String(f.v)+(f.u||''));
    const inp=f.opts?h('select',{onchange:e=>{vals[f.k]=e.target.value;}},...f.opts.map(([v,l])=>h('option',{value:v,selected:v===f.v},l)))
      :h('input',{type:'range',min:f.min,max:f.max,step:f.step||1,value:f.v,oninput:e=>{ vals[f.k]=+e.target.value; out.textContent=e.target.value+(f.u||''); }});
    box.append(h('div',{class:'frow'},h('span',null,f.l),inp,f.opts?null:out)); });
  box.append(h('div',{class:'btnrow',style:'justify-content:flex-end;margin-top:10px'},h('button',{onclick:closeModal},'취소'),h('button',{class:'pri',onclick:()=>{ pushUndo(); onApply(vals); edited(); rDraw(); closeModal(); }},'적용 (Enter)')));
  openModal(box);
}
function dlgQuantize(){ dlg('퀀타이즈 (Alt+Q)',[{k:'grid',l:'그리드',v:String(R.snap||24),opts:SNAPS.filter(s=>s[0]).map(([v,l])=>[String(v),l])},{k:'str',l:'강도',v:100,min:0,max:100,u:'%'},{k:'ends',l:'끝점(길이)도',v:'0',opts:[['0','시작점만'],['1','시작+길이']]}],
  v=>{ const g=+v.grid, k=v.str/100; targets().forEach(n=>{ const q=Math.round(n.s/g)*g; n.s=Math.round(n.s+(q-n.s)*k); if(v.ends==='1') n.l=Math.max(g,Math.round(n.l/g)*g); }); },'선택한 노트(없으면 전체)를 그리드에 맞춥니다. 강도를 낮추면 인간적인 흔들림이 남아요.'); }
function dlgStrum(){ dlg('스트럼 (Alt+S)',[{k:'time',l:'펼침 시간',v:18,min:0,max:120,u:'ms'},{k:'dir',l:'방향',v:'up',opts:[['up','아래 → 위 (업)'],['down','위 → 아래 (다운)'],['alt','업/다운 교대']]},{k:'curve',l:'텐션',v:0,min:-100,max:100},{k:'vel',l:'벨로시티 감쇠',v:6,min:0,max:30}],
  v=>{ const groups={}; targets().forEach(n=>{ (groups[n.s]=groups[n.s]||[]).push(n); }); let gi=0; Object.values(groups).forEach(gp=>{ const up=v.dir==='up'||(v.dir==='alt'&&gi%2===0); gp.sort((a,b)=>up?a.p-b.p:b.p-a.p);
    const tks=v.time/1000/tickSec(); gp.forEach((n,i)=>{ const f=gp.length>1?i/(gp.length-1):0; const c=v.curve/100; const ff=c>=0?Math.pow(f,1+c*2):1-Math.pow(1-f,1-c*2); const off=Math.round(ff*tks); n.s+=off; n.l=Math.max(6,n.l-off); n.v=clamp(Math.round(n.v-i*v.vel/3),1,127); }); gi++; }); },
  '같은 시점의 코드 음들을 손으로 긁듯이 시간차로 펼칩니다. 피아노 브레이크다운에 10~30ms가 자연스럽습니다.'); }
function dlgRandom(){ dlg('랜덤 / 휴머나이즈 (Alt+R)',[{k:'vel',l:'벨로시티 랜덤',v:10,min:0,max:40},{k:'time',l:'타이밍 랜덤',v:4,min:0,max:30,u:'ms'},{k:'len',l:'길이 랜덤',v:0,min:0,max:30,u:'%'},{k:'seed',l:'시드',v:Math.floor(Math.random()*999),min:1,max:999}],
  v=>{ const Rn=rng(v.seed); const tks=v.time/1000/tickSec(); targets().forEach(n=>{ n.v=clamp(Math.round(n.v+gauss(Rn)*v.vel*0.6),1,127); n.s=Math.max(0,Math.round(n.s+gauss(Rn)*tks*0.6)); if(v.len) n.l=Math.max(6,Math.round(n.l*(1+gauss(Rn)*v.len/100*0.6))); }); },'정규분포 기반으로 사람이 연주한 듯한 미세한 흔들림을 줍니다.'); }
function dlgScale(){ dlg('레벨 스케일 (Alt+X) — 벨로시티',[{k:'scale',l:'스케일',v:100,min:20,max:200,u:'%'},{k:'off',l:'오프셋',v:0,min:-60,max:60},{k:'from',l:'램프 시작',v:100,min:10,max:150,u:'%'},{k:'to',l:'램프 끝',v:100,min:10,max:150,u:'%'},{k:'lo',l:'최소',v:1,min:1,max:127},{k:'hi',l:'최대',v:127,min:1,max:127}],
  v=>{ const ns=targets(); if(!ns.length) return; const s0=Math.min(...ns.map(n=>n.s)), s1=Math.max(...ns.map(n=>n.s))||1; ns.forEach(n=>{ const f=s1>s0?(n.s-s0)/(s1-s0):0; const ramp=(v.from+(v.to-v.from)*f)/100; n.v=clamp(Math.round((64+(n.v-64)*v.scale/100)*ramp+v.off),v.lo,v.hi); }); },
  '벨로시티 폭을 넓히거나 좁히고, 램프로 크레센도/디크레센도를 만듭니다. (예: 램프 60% → 120% = 빌드업 크레센도)'); }
function dlgNoteProps(n){ dlg('노트 속성 — '+noteName(n.p),[{k:'v',l:'벨로시티',v:n.v,min:1,max:127},{k:'p',l:'음높이',v:n.p,min:21,max:108},{k:'l',l:'길이 (틱, 96=1박)',v:n.l,min:3,max:BAR*2},{k:'m',l:'뮤트',v:n.m?'1':'0',opts:[['0','켜짐'],['1','뮤트']]}],
  v=>{ n.v=v.v; n.p=v.p; n.l=v.l; n.m=v.m==='1'; }); }
/* ---------- 키보드 (FL Studio 피아노 롤) ---------- */
const TYPE_MAP={z:0,s:1,x:2,d:3,c:4,v:5,g:6,b:7,h:8,n:9,j:10,m:11,',':12,q:12,2:13,w:14,3:15,e:16,r:17,5:18,t:19,6:20,y:21,7:22,u:23,i:24,9:25,o:26,0:27,p:28};
function rollKey(e){
  const k=e.key.toLowerCase(), c=e.ctrlKey||e.metaKey, a=e.altKey, sh=e.shiftKey;
  const sel=[...R.sel];
  if(c&&k==='t'){ e.preventDefault(); R.typing=!R.typing; rToolbar(); toast(R.typing?'⌨ 타이핑 키보드 → 피아노 ON':'⌨ 타이핑 키보드 OFF'); return true; }
  if(R.typing&&!c&&!a&&k in TYPE_MAP){ e.preventDefault(); if(!e.repeat) audition([{p:60+TYPE_MAP[k],v:100}],0.6); return true; }
  if(c&&k==='a'){ e.preventDefault(); R.sel=new Set(S.notes); rDraw(); return true; }
  if(c&&k==='d'){ e.preventDefault(); R.sel.clear(); rDraw(); return true; }
  if(c&&k==='c'){ e.preventDefault(); if(!sel.length) return true; const m=Math.min(...sel.map(n=>n.s)); R.clip=sel.map(n=>({...n,s:n.s-m})); R._clipAt=m; toast(sel.length+'개 노트 복사'); return true; }
  if(c&&k==='x'){ e.preventDefault(); if(!sel.length) return true; pushUndo(); const m=Math.min(...sel.map(n=>n.s)); R.clip=sel.map(n=>({...n,s:n.s-m})); R._clipAt=m; S.notes=S.notes.filter(n=>!R.sel.has(n)); R.sel.clear(); edited(); rDraw(); return true; }
  if(c&&k==='v'){ e.preventDefault(); if(!R.clip.length) return true; pushUndo(); const at=T.playing||T.startTick?Math.floor(nowTick()/(R.snap||24))*(R.snap||24):(R._clipAt||0); const ns=R.clip.map(n=>({...n,s:n.s+at})); S.notes.push(...ns); R.sel=new Set(ns); edited(); rDraw(); return true; }
  if(c&&k==='b'){ e.preventDefault(); dupRight(); return true; }
  if(c&&k==='q'){ e.preventDefault(); quickQuantize(); return true; }
  if(c&&k==='l'){ e.preventDefault(); quickLegato(); return true; }
  if(c&&k==='u'){ e.preventDefault(); quickChop(); return true; }
  if(c&&k==='g'){ e.preventDefault(); glue(); return true; }
  if(c&&e.key==='Insert'){ e.preventDefault(); insertSpace(false); return true; }
  if(c&&e.key==='Delete'){ e.preventDefault(); insertSpace(true); return true; }
  if(c&&(e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault(); const tg=targets(); pushUndo(); tg.forEach(n=>n.p=clamp(n.p+(e.key==='ArrowUp'?12:-12),0,127)); edited(); rDraw(); return true; }
  if(a&&!c){
    if(k==='q'){ e.preventDefault(); dlgQuantize(); return true; } if(k==='s'){ e.preventDefault(); dlgStrum(); return true; }
    if(k==='r'){ e.preventDefault(); dlgRandom(); return true; } if(k==='x'){ e.preventDefault(); dlgScale(); return true; }
    if(k==='v'){ e.preventDefault(); R.ghost=!R.ghost; rToolbar(); rDraw(); return true; }
    if(k==='m'){ e.preventDefault(); pushUndo(); targets().forEach(n=>n.m=!sh); edited(); rDraw(); toast(sh?'뮤트 해제':'선택 노트 뮤트'); return true; }
    if(e.key.startsWith('Arrow')){ e.preventDefault(); if(!sel.length) return true; pushUndo(); const d=e.key==='ArrowLeft'?-3:e.key==='ArrowRight'?3:0, dp=e.key==='ArrowUp'?1:e.key==='ArrowDown'?-1:0; sel.forEach(n=>{ n.s=Math.max(0,n.s+d); n.p=clamp(n.p+dp,0,127); }); edited(); rDraw(); return true; }
  }
  if(sh&&!c&&!a){
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); if(!sel.length) return true; pushUndo(); sel.forEach(n=>n.p=clamp(n.p+(e.key==='ArrowUp'?1:-1),0,127)); audition([{p:sel[0].p,v:sel[0].v}],0.2); edited(); rDraw(); return true; }
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ e.preventDefault(); if(!sel.length) return true; pushUndo(); const d=(e.key==='ArrowRight'?1:-1)*(R.snap||24); sel.forEach(n=>n.s=Math.max(0,n.s+d)); edited(); rDraw(); return true; }
    if(e.code==='Digit0'){ e.preventDefault(); R.sx=nowTick()-visT()/2; rDraw(); return true; }
    if(e.code==='Digit4'){ e.preventDefault(); showAll(); return true; }
    if(e.code==='Digit5'){ e.preventDefault(); zoomSel(); return true; }
    if(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3'){ e.preventDefault(); R.ppt=[0,0.35,0.9,2.2][+e.code.slice(-1)]; rDraw(); return true; }
    if(k==='i'){ e.preventDefault(); R.sel=new Set(S.notes.filter(n=>!R.sel.has(n))); rDraw(); return true; }
    if(k==='r'){ e.preventDefault(); const Rn=rng(Date.now()); R.sel=new Set(S.notes.filter(()=>Rn()<0.5)); rDraw(); return true; }
  }
  if(c||a) return false;
  if(e.key==='Delete'){ e.preventDefault(); if(!sel.length) return true; pushUndo(); S.notes=S.notes.filter(n=>!R.sel.has(n)); R.sel.clear(); edited(); rDraw(); return true; }
  if(e.key==='Backspace'){ e.preventDefault(); R.snapOn=!R.snapOn; rToolbar(); toast('스냅 '+(R.snapOn?'켜짐':'꺼짐'),800); return true; }
  if(e.key==='PageUp'){ e.preventDefault(); zoomAt(1.25); return true; }
  if(e.key==='PageDown'){ e.preventDefault(); zoomAt(0.8); return true; }
  const tk={p:'draw',b:'paint',d:'erase',t:'mute',c:'slice',e:'select',z:'zoom',y:'play'}[k];
  if(tk&&!sh){ e.preventDefault(); setTool(tk); return true; }
  return false;
}

/* ============ 앱 : 상태 · 화면 · 보이싱 랩 UI ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function h(tag,attrs,...kids){ const e=document.createElement(tag);
  if(attrs) for(const k in attrs){ const v=attrs[k]; if(k==='class') e.className=v; else if(k==='style') e.style.cssText=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(k==='html') e.innerHTML=v; else if(v!==false&&v!=null) e.setAttribute(k,v===true?'':v); }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); } return e; }
function toast(m,ms){ const t=$('#toast'); t.innerHTML=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),ms||1700); }
function openModal(c){ const b=$('#modalBox'); b.innerHTML=''; b.append(c); $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
function download(blob,name){ const a=h('a',{href:URL.createObjectURL(blob),download:name}); document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }

/* ---------- 상태 ---------- */
function defaultState(){ return {v:3,key:{root:9,mode:'min'},bpm:126,slots:[],sel:0,
  V:{style:'proWide',reg:0,width:1,lead:1,bassMode:'full',lhReg:0,topLine:'smooth',avoidThirdTop:true},
  rhythm:'block',arp:'off',velPreset:'pianist',velCustom:{},seed:7,sound:'grand',bassOn:false,bassStyle:'offbeat',kick:false,notes:[],sync:true,defVel:100,view:'lab'}; }
let S=defaultState();
const H={undo:[],redo:[],zToggle:false};
const ser=()=>JSON.stringify(S,(k,v)=>k.startsWith('_')?undefined:v);
function pushUndo(){ H.undo.push(ser()); if(H.undo.length>120) H.undo.shift(); H.redo.length=0; H.zToggle=false; }
function restore(j){ const view=S.view; S=JSON.parse(j); S.view=view; R.sel.clear(); regen(false); renderAll(); save(); }
function undoStep(){ if(!H.undo.length) return toast('더 이상 되돌릴 작업이 없습니다'); H.redo.push(ser()); restore(H.undo.pop()); toast('↶ 실행 취소'); }
function redoStep(){ if(!H.redo.length) return; H.undo.push(ser()); restore(H.redo.pop()); toast('↷ 다시 실행'); }
function ctrlZ(){ /* FL Studio: Ctrl+Z = 마지막 편집 실행취소/재실행 토글 */ if(H.zToggle&&H.redo.length){ redoStep(); H.zToggle=false; } else { undoStep(); H.zToggle=true; } }
let _sv=null; function save(){ clearTimeout(_sv); _sv=setTimeout(()=>{ try{ localStorage.setItem('sinivurizer.chords',ser()); }catch(e){} },500); }

/* ---------- 생성 ---------- */
function regen(forceNotes){
  S._voiced=voiceProgression(S.slots,S.key,S.V);
  if(S.sync||forceNotes){
    const {ev}=buildEvents(Object.assign({},S,{state:0}),S._voiced); const td=60/S.bpm/PPQ;
    S.notes=ev.map(e=>({p:e.p,s:Math.max(0,Math.round(e.s+(e.off||0)/td)),l:Math.max(4,Math.round(e.l)),v:e.v,m:false,role:e.role}));
  }
  S._bass=bassEvents(S,S._voiced);
}
function changed(o){ o=o||{}; regen(false); if(o.rack!==false) renderLabCenter(); renderRight(); if(S.view==='roll') rDraw(); if(o.left) renderLeft(); save(); }
function slotFrom(c){ return {r:c.r,q:c.q,beats:c.beats||S._defBeats||4,bass:c.bass==null?null:c.bass,top:null,oct:0,inv:'auto',acc:1}; }
function addChord(c,replace){
  pushUndo();
  if(replace&&S.slots.length){ const old=S.slots[S.sel]; S.slots[S.sel]=Object.assign(slotFrom(c),{beats:old.beats}); }
  else { S.slots.splice(S.slots.length?S.sel+1:0,0,slotFrom(c)); S.sel=S.slots.length===1?0:S.sel+1; }
  changed({left:true}); auditionSlot(S.sel);
}
function auditionSlot(i){ const vc=S._voiced&&S._voiced[i]; if(!vc) return; const VP=Object.assign({},VEL_PRESETS[S.velPreset],S.velCustom);
  const ns=vc.notes.map((n,k)=>({p:n.p,v:n.role==='top'?Math.min(127,VP.hi):n.role==='lh'?Math.round((VP.lo+VP.hi)/2+8):Math.round((VP.lo+VP.hi)/2-4),off:k*VP.roll/1000})); audition(ns,1.4); }

/* ---------- 상단 ---------- */
function initTop(){
  const kr=$('#keyRoot'); NOTE_NAMES.forEach((n,i)=>kr.append(h('option',{value:i},n+(FLAT_NAMES[n]?'/'+FLAT_NAMES[n]:''))));
  kr.onchange=()=>{ pushUndo(); S.key.root=+kr.value; changed({left:true}); };
  $('#keyMode').onchange=e=>{ pushUndo(); S.key.mode=e.target.value; changed({left:true}); };
  $('#bpm').onchange=e=>{ S.bpm=clamp(+e.target.value||126,60,200); e.target.value=S.bpm; changed(); };
  $('#bpm').addEventListener('wheel',e=>{ e.preventDefault(); S.bpm=clamp(S.bpm+(e.deltaY<0?1:-1),60,200); $('#bpm').value=S.bpm; changed(); },{passive:false});
  $('#btnPlay').onclick=()=>T.playing?stopPlay(false):play(); $('#btnStop').onclick=()=>stopPlay(true);
  const so=$('#sound'); Object.entries(SOUNDS).forEach(([k,v])=>so.append(h('option',{value:k},v.ko))); so.onchange=()=>{ S.sound=so.value; save(); auditionSlot(S.sel); };
  const rh=$('#rhythm'); Object.entries(RHYTHMS).forEach(([k,v])=>rh.append(h('option',{value:k},v.ko))); rh.onchange=()=>{ pushUndo(); S.rhythm=rh.value; changed(); };
  const ar=$('#arp'); Object.entries(ARPS).forEach(([k,v])=>ar.append(h('option',{value:k},'아르프: '+v.ko))); ar.onchange=()=>{ pushUndo(); S.arp=ar.value; changed(); };
  $('#btnKick').onclick=()=>{ S.kick=!S.kick; $('#btnKick').classList.toggle('on',S.kick); save(); };
  $('#btnBass').onclick=()=>{ S.bassOn=!S.bassOn; $('#btnBass').classList.toggle('on',S.bassOn); save(); };
  const bs=$('#bassStyle'); [['offbeat','오프비트'],['rolling','롤링 16분'],['sustain','서스테인']].forEach(([k,l])=>bs.append(h('option',{value:k},'베이스: '+l))); bs.onchange=()=>{ S.bassStyle=bs.value; changed(); };
  $('#btnUndo').onclick=undoStep; $('#btnRedo').onclick=redoStep;
  $('#btnNew').onclick=()=>{ if(!confirm('완전히 새로 시작할까요? (Ctrl+Alt+Z로 되돌릴 수 있어요)')) return; pushUndo(); stopPlay(true); const v=S.view; S=defaultState(); S.view=v; R.sel.clear(); changed({left:true}); renderAll(); toast('🆕 빈 프로젝트'); };
  $('#btnOpen').onclick=()=>$('#fileIn').click(); $('#fileIn').onchange=openFile;
  $('#btnSave').onclick=saveFile; $('#btnExport').onclick=showExport; $('#btnHelp').onclick=()=>startTutorial();
  $$('#views button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  document.addEventListener('mouseover',e=>{ const el=e.target.closest('[data-hint]'); if(el) $('#hintText').innerHTML=el.dataset.hint; });

function importMidi(buf){ /* Ctrl+M : MIDI 노트를 피아노 롤로 */
  const d=new DataView(buf); let p=0; const str=n=>{ let s=''; for(let i=0;i<n;i++) s+=String.fromCharCode(d.getUint8(p+i)); p+=n; return s; };

    while(p<end){ t+=vl(); let st=d.getUint8(p); if(st&0x80){ p++; if(st<0xF0) rs=st; } else st=rs;
      if(st===0xFF){ d.getUint8(p++); const l=vl(); p+=l; continue; } if(st===0xF0||st===0xF7){ const l=vl(); p+=l; continue; }

    p=end; }

}

function notesMidi(o){
  const us=Math.round(60000000/S.bpm); const meta=[{t:0,o:0,b:[0xFF,0x51,3,(us>>16)&255,(us>>8)&255,us&255]},{t:0,o:1,b:[0xFF,0x58,4,4,2,24,8]}];
  let t=0; S.slots.forEach((sl,i)=>{ const nm=S._voiced[i].name; meta.push({t,o:2,b:[0xFF,0x06,...vlq(enc(nm).length),...enc(nm)]}); t+=sl.beats*PPQ; });

function initKeys(){
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input[type=text],input[type=number],input[type=search],textarea,select')) return;
    if($('#modal').classList.contains('on')){ if(e.key==='Escape') closeModal(); if(e.key==='Enter'){ const b=$('#modalBox .pri'); if(b){ e.preventDefault(); b.click(); } } return; }
    const k=e.key.toLowerCase(), c=e.ctrlKey||e.metaKey;
    if(e.code==='Space'){ e.preventDefault(); if(c){ T.playing?stopPlay(false):play(); } else { T.playing?stopPlay(true):play(); } return; }
    if(c&&e.altKey&&k==='z'){ e.preventDefault(); undoStep(); return; }
    if(c&&k==='z'){ e.preventDefault(); ctrlZ(); return; }
    if(c&&k==='s'){ e.preventDefault(); saveFile(); return; }
    if(c&&k==='m'){ e.preventDefault(); $('#fileIn').click(); return; }
    if(c&&k==='e'){ e.preventDefault(); showExport(); return; }
    if(e.key==='F7'){ e.preventDefault(); setView(S.view==='roll'?'lab':'roll'); return; }
    if(e.key==='F1'){ e.preventDefault(); startTutorial(); return; }
    if(S.view==='roll'){ if(rollKey(e)) return; return; }
    if(S.view!=='lab') return;
    if(/^Digit[1-7]$/.test(e.code)&&!c&&!e.altKey){ e.preventDefault(); const i=+e.code.slice(-1)-1; addChord(diatonic(S.key.mode,e.shiftKey)[i],S._pal==='rep'); return; }
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ e.preventDefault(); if(!S.slots.length) return; S.sel=clamp(S.sel+(e.key==='ArrowRight'?1:-1),0,S.slots.length-1); renderLabCenter(); renderRight(); auditionSlot(S.sel); if(LT==='sug') renderLeft(); return; }
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); topStep(e.key==='ArrowUp'?1:-1); return; }
    if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); delSlot(S.sel); return; }
    if(c&&k==='b'){ e.preventDefault(); if(S.slots.length) dupSlot(S.sel); return; }
    if(k==='enter'){ auditionSlot(S.sel); }
  });
}

 {g:'시작하기',id:'s-intro',t:'이 가이드북 사용법',h:`
  <p class="lead">멜로딕 프로그레시브 하우스에 필요한 거의 모든 사운드를 <b>Sylenth1</b>과 <b>Serum 2</b>로 처음부터 만드는 레시피 모음입니다.</p>
  ${ul(['모든 수치는 <b>출발점</b>입니다. 곡의 키·템포·다른 악기와의 관계에 따라 귀로 최종 조정하세요.',
  '레시피는 <b>오실레이터 → 필터 → 엔벨로프 → 모듈레이션 → FX → 연주 → 믹스</b> 순서로 되어 있어, 그대로 따라 하면 소리가 완성됩니다.',
  'Sylenth1은 노브 값이 대부분 0~10 스케일, Serum 2는 %·Hz·ms 단위로 표기했습니다.',
  '이 앱의 보이싱 랩에서 만든 코드를 MIDI로 내보내 이 레시피의 패치에 넣으면 바로 프로급 코드 사운드가 됩니다.',
  '<b>레이어링</b> 장(章)의 원칙대로 2~4개 패치를 겹치는 것이 프로 사운드의 비밀입니다.'])}
  ${tip('소리를 만들 때는 항상 <b>코드 진행을 재생하면서</b> 조절하세요. 단음으로 좋던 소리가 코드에서는 탁해지는 일이 많습니다.')}`},
 {g:'시작하기',id:'s-core',t:'프로그레시브 하우스 사운드의 핵심 원리',h:`
  <h3>1. 유니즌 & 디튠 = 폭과 두께</h3>${ul(['유니즌 보이스 수: 리드·코드 7~9 (Serum은 7~11), 플럭 3~5, 베이스 1~3, 서브 1.','디튠은 "넓게"가 아니라 <b>"반짝이게"</b> 쓰는 것. 과하면 음정이 흐려지고 믹스에서 작아집니다.','블렌드(중앙 vs 사이드 비율)로 센터를 단단하게 남겨 두어야 모노 재생에서도 살아남습니다.'])}
  <h3>2. 필터 엔벨로프 = 플럭과 움직임</h3>${ul(['플럭 = 컷오프 낮게 + 필터 엔벨로프 양 크게 + 디케이 짧게 + 서스테인 0.','리드 = 컷오프 높게, 약한 엔벨로프로 어택만 살짝 밝게.','빌드업에서는 컷오프를 오토메이션으로 서서히 열어 긴장감을 만듭니다.'])}
  <h3>3. 사이드체인 = 그루브</h3>${ul(['킥이 칠 때마다 코드·베이스·패드의 볼륨을 눌렀다가 되살리는 것이 장르의 정체성입니다.','신스 안의 LFO(볼륨 → 4분음표 싱크)로 미리 펌핑을 넣거나, DAW에서 사이드체인 컴프/볼륨 쉐이퍼로 처리합니다.'])}
  <h3>4. 공간 = 리버브 + 딜레이</h3>${ul(['3/16(점8분) 또는 1/4 핑퐁 딜레이가 프로그레시브 특유의 넓은 공간을 만듭니다.','리버브는 보통 신스 안보다 <b>DAW의 Send 버스</b>로 걸어 여러 악기가 같은 공간을 공유하게 하세요.'])}
  <h3>5. 음역 분리</h3>${tbl(['역할','주 음역','처리'],[['서브','30~80Hz','모노, 사인/삼각'],['미드 베이스','80~400Hz','하이패스로 서브와 분리'],['코드/패드','200Hz~8kHz','150~300Hz 하이패스'],['리드','400Hz~12kHz','2~5kHz 존재감'],['플럭/아르프','500Hz~10kHz','리드와 다른 옥타브에'],['FX·노이즈','2kHz 이상','하이패스 + 넓은 스테레오']])}`},
 {g:'시작하기',id:'s-sylenth',t:'Sylenth1 구조 한눈에 보기',h:`
  ${ul(['<b>Part A / Part B</b> : 각 파트에 오실레이터 2개(A1·A2, B1·B2) + 필터 1개 + 볼륨 엔벨로프. 두 파트를 섞어 최대 4개 오실레이터.',
  '<b>오실레이터</b> : Wave(Sine/Triangle/Saw/Pulse/HPulse/QPulse/TriSaw/Noise), Octave·Note·Fine, <b>Voices(1~8)</b>, <b>Detune(0~10)</b>, Phase, Stereo, Pan, Volume, Retrig.',
  '<b>Filter A/B</b> : 타입(Lowpass/Bandpass/Highpass), 12/24dB, Cutoff, Resonance, Drive. <b>Filter Control</b>에서 전체 컷오프·레조넌스·KeyTrack·Warm Drive를 한 번에 제어.',
  '<b>Mod Env 1·2</b> (각 2개 목적지), <b>LFO 1·2</b> (템포 싱크 가능), <b>Mod Matrix</b>(벨로시티·모드휠·키트랙 등).',
  '<b>Misc</b> : Mono/Legato, Portamento, Polyphony, Mix A/B, Pitch Bend 범위.',
  '<b>FX</b> : Distortion · Phaser · Chorus/Flanger · Equalizer · Delay · Reverb · Compressor. <b>Arpeggiator</b> 내장.'])}
  ${tip('Sylenth1의 진짜 무기는 <b>Part A와 B를 서로 다른 필터/엔벨로프로 쓰는 것</b>입니다. 예: A = 어택이 강한 플럭, B = 지속되는 소우 → 하나의 프리셋으로 레이어 완성.')}`},
 {g:'시작하기',id:'s-serum',t:'Serum 2 구조 한눈에 보기',h:`
  ${ul(['<b>오실레이터 A·B·C</b> : 각각 Wavetable / Sample / Multisample / Granular / Spectral 모드 선택. 웨이브테이블 모드에서 WT Pos, Unison(최대 16), Detune, Blend, Warp(두 개 동시 적용 가능), Octave·Semi·Fine, Level, Pan.',
  '<b>SUB · NOISE</b> 오실레이터 별도. 노이즈 오실레이터에 어택 트랜지언트·텍스처 샘플을 넣을 수 있음.',
  '<b>필터 2개</b> : 직렬(Serial) 또는 병렬(Parallel) 라우팅. 아날로그 모델 등 새 필터 타입 다수.',
  '<b>믹서 섹션</b> : 각 오실레이터/필터의 레벨과 라우팅을 한 화면에서 관리.',
  '<b>모듈레이션</b> : ENV 1(볼륨 고정) + 추가 엔벨로프, 다수의 LFO, 매크로. 노브에 드래그 앤 드롭으로 연결.',
  '<b>FX</b> : 이펙트 랙이 확장되어 버스(병렬 체인)와 마스터 FX 체인을 구성할 수 있음. Hyper/Dimension, Distortion, Chorus, Delay, Reverb, Compressor(멀티밴드), EQ, Filter 등.',
  '<b>아르페지에이터 · 클립 시퀀서</b> 내장.'])}
  ${tip('Serum 2에서는 <b>오실레이터 C를 "레이어 전용"</b>으로 쓰면 편합니다. A·B로 본체를 만들고, C에 한 옥타브 위 사인/소우나 노이즈 샘플을 얹어 반짝임을 더하세요.')}`},
 {g:'리드',id:'s-lead',t:'① 페스티벌 슈퍼소우 리드',h:recipe({
  role:'드롭의 주인공. 넓고 밝고 공격적이지만 귀가 아프지 않은, 멜로딕 프로그레시브 하우스의 대표 리드.',
  sy:['Init 프리셋에서 시작. Part A와 B 모두 사용.','<b>A1</b>: Saw, Voices 8, Detune 2.8~3.4, Stereo 10, Octave 0.','<b>A2</b>: Saw, Voices 8, Detune 2.2, Octave +1, Volume 6~7 (옥타브 레이어).','<b>B1</b>: Saw, Voices 4, Detune 1.0, Octave −1, Volume 5 (몸통).','<b>B2</b>: Pulse 또는 TriSaw, Voices 2, Detune 0.5, Volume 3 (중역 질감).',
   '<b>Filter A/B</b>: Lowpass 24dB, Cutoff 7.5~8.5, Resonance 0.5~1.5, Drive 1~2. Filter Control Cutoff 8~9, KeyTrack 3.',
   '<b>Amp Env A/B</b>: Attack 0, Decay 6, Sustain 9, Release 2.5~3.5.','<b>Mod Env 1</b> → Cutoff AB 양 +1.5, Attack 0, Decay 3, Sustain 0 (어택의 반짝임).','<b>Misc</b>: Polyphony 8 이상, Portamento 0 (또는 Legato 모드 + Portamento 1.5로 글라이드).'],
  se:['OSC A: Wavetable "Basic Shapes" 계열 Saw, Unison 9, Detune 0.18~0.25, Blend 70%, Level 75%.','OSC B: 같은 Saw, Octave +1, Unison 7, Detune 0.15, Level 45%.','OSC C: Saw 또는 약간 밝은 웨이브테이블, Octave −1, Unison 3, Detune 0.06, Level 40%.','SUB: 끔 (서브는 베이스 트랙 담당).','Filter 1: 아날로그 모델 LP 24, Cutoff 6~9kHz, Res 10~15%, Drive 15%. A·B·C 모두 통과.','ENV 1: A 1ms, D 600ms, S 85%, R 300ms.','ENV 2 → Filter 1 Cutoff +10~15%: A 0, D 250ms, S 0.','Warp: OSC A에 Sync Window 약간(5~10%)으로 공격적인 배음 추가 (선택).'],
  fx:['Hyper/Dimension 소량(Mix 15~25%) — 폭과 반짝임','Distortion: Tube 또는 Soft Clip 소량 — 배음 밀도','EQ: 200~300Hz 하이패스(로우컷), 2.5~4kHz 살짝 부스트','Compressor(멀티밴드) 소량 — OTT 스타일, Depth 15~25%','Delay: 3/16 핑퐁, Feedback 25~35%, Mix 10~15%','Reverb: Hall, Size 크게, Mix 15~20% (또는 DAW Send)'],
  play:['멜로디는 C5~C6 근처. 코드 톱노트보다 위에.','글라이드를 쓸 땐 레가토로 노트를 겹치게 그리세요 (피아노 롤 Ctrl+L).','벨로시티는 크게 의미 없음 — 대신 엔벨로프·필터 오토메이션으로 다이내믹.'],
  mix:['리드 버스에 Fruity Parametric EQ 2로 250Hz 이하 정리, 사이드체인 25~40%.','레이어(피아노 플럭·사인 서브리드·화이트노이즈)를 함께 버스로 묶어 하나의 리드처럼 처리.','⚠ Detune 과다 = 음정이 흐려져 "작게" 들림. 레퍼런스와 모노로 비교하세요.']})},
 {g:'리드',id:'s-bigroom',t:'② 빅룸 스크리치 리드',h:recipe({
  role:'짧고 공격적인 빅룸/일렉트로 드롭 리드. 멜로딕 곡의 2번째 드롭이나 하이브리드 구성에.',
  sy:['A1: Pulse(또는 HPulse), Voices 6, Detune 4, Stereo 10.','A2: Saw, Octave −1, Voices 3, Detune 1.5.','Filter: Lowpass 24dB, Cutoff 5.5, Resonance 4~5, Drive 4.','Mod Env 1 → Cutoff +3, Decay 2.5, Sustain 2.','Amp Env: A 0, D 4, S 8, R 1.5.','LFO 1 → Pitch 아주 소량(비브라토 0.1~0.2) 선택.'],
  se:['OSC A: 펄스 계열 웨이브테이블, WT Pos로 듀티 조절(좁을수록 날카로움), Unison 7, Detune 0.3.','OSC B: Saw −1옥타브, Unison 3.','Filter: LP 24 + Drive 30~40%, Res 35%.','ENV 2 → Cutoff, Decay 200ms.','Warp: Bend+ 또는 PWM 계열로 공격성.'],
  fx:['Distortion Hard Clip/Tube 30~50%','EQ: 300Hz 이하 컷, 1~2kHz 피크 정리','Multiband Comp 30%','짧은 Reverb (Room, Mix 10%)'],
  play:['짧은 노트, 반복적 리듬. 2~3개의 음만으로 훅을 만듭니다.','피치 벤드/피치 엔벨로프로 시작음을 위에서 떨어뜨리면 빅룸 느낌.'],
  mix:['킥과 같은 시점의 트랜지언트가 부딪히므로 사이드체인 필수(40%+).','1~3kHz가 귀를 찌르면 다이내믹 EQ로 눌러 주세요.']})},
 {g:'리드',id:'s-vocal',t:'③ 보컬 찹 스타일 리드',h:recipe({
  role:'보컬 샘플 없이도 "사람 목소리 같은" 탑라인. 퓨처 팝·멜로딕 팝 EDM 드롭.',
  sy:['A1: Saw, Voices 4, Detune 1.5. A2: Saw +1옥타브, Volume 4.','Filter A: Bandpass 12dB, Cutoff 6, Resonance 6 (포먼트 피크).','Filter B: Lowpass, Cutoff 7.','LFO 1(Sync 1/8) → Cutoff 아주 소량 — 모음이 움직이는 느낌.','Amp Env: A 0, D 3, S 5, R 1.5. Legato + Portamento 1.'],
  se:['OSC A: 보컬/포먼트 계열 웨이브테이블(예: "Vowel" 계열), WT Pos를 LFO나 매크로로 움직여 모음 변화.','또는 Sample/Granular 모드에 짧은 보컬 샘플을 넣고 Position을 노트마다 다르게.','Filter: Formant 계열 필터 + LP.','ENV 2 → WT Pos로 노트마다 "아-오" 변화.'],
  fx:['Chorus 소량','Delay 1/8, Mix 15%','Reverb Plate 20%','Pitch 보정은 필요 없음 — 대신 짧은 노트와 슬라이드로 사람 느낌'],
  play:['16분 싱코페이션, 같은 음 반복 + 마지막 음만 위로 튀기기.','노트 사이 슬라이드(포르타멘토)가 "목소리" 느낌의 핵심.'],
  mix:['2~4kHz 존재감, 300Hz 이하 컷.','실제 보컬과 함께 쓸 땐 보컬보다 한 옥타브 위에 배치.']})},
 {g:'리드',id:'s-chip',t:'④ 노르딕 스퀘어 플럭 리드',h:recipe({
  role:'서정적인 노르딕/멜로딕 감성 리드 — 짧고 맑은 스퀘어/소우 플럭.',
  sy:['A1: Pulse, Voices 2, Detune 0.8. A2: Saw +1옥타브, Volume 3.','Filter: Lowpass 12dB, Cutoff 4.5, Resonance 2.','Mod Env 1 → Cutoff +4, Decay 2.5, Sustain 2.','Amp Env: A 0, D 3.5, S 4, R 2.'],
  se:['OSC A: Square, Unison 3, Detune 0.1. OSC B: Saw +12, Level 20%.','Filter LP 12, Cutoff 2.5~3.5kHz, ENV 2 → Cutoff +25%, D 250ms, S 30%.','ENV 1: A 2ms, D 350ms, S 45%, R 250ms.'],
  fx:['Delay 1/8 핑퐁 20~25%','Reverb Hall 30%','Chorus 소량'],
  play:['8분 음표 위주로 흐르는 멜로디, 4마디마다 끝음을 길게.','오른손 아르페지오처럼 코드톤을 순회하면 노르딕 특유의 서정성.'],
  mix:['리버브를 사이드체인해서 드롭에서 리듬감 유지.','패드와 같은 옥타브면 마스킹 — 리드는 C5 이상.']})},
 {g:'코드·플럭',id:'s-stab',t:'⑤ 슈퍼소우 코드 스탭',h:recipe({
  role:'드롭의 화성을 책임지는 두껍고 넓은 코드. 이 앱의 "앤썸 슈퍼소우 스택" 또는 "프로 와이드" 보이싱과 짝.',
  sy:['A1·A2: Saw, Voices 8, Detune 3.0 / 2.5, A2는 Octave +1 Volume 5.','B1: Saw, Voices 4, Detune 1.2 (중앙 보강).','Filter: Lowpass 24dB, Cutoff 7, Resonance 0.5.','Amp Env: A 0, D 4, S 6, R 2 (스탭이면 Sustain 낮게).','Mod Env 1 → Cutoff +1 (어택 반짝임).'],
  se:['OSC A: Saw, Unison 9, Detune 0.3, Blend 75%. OSC B: Saw +12, Unison 5, Level 30%.','Filter LP 24, Cutoff 6~7kHz.','ENV 1: A 1ms, D 400ms, S 60%, R 200ms.','LFO 1 (Envelope 모드 또는 1/4 싱크, 톱니 반전) → Master Level: 신스 내부 펌핑 (DAW 사이드체인 대신).'],
  fx:['EQ: 200~300Hz 하이패스 (코드는 저역을 비워라!)','Hyper/Dimension 20%','Multiband Comp 20%','Reverb 15~20%'],
  play:['오프비트 8분, 3-3-2 싱코페이션이 정석 (이 앱의 주법 메뉴 참고).','벨로시티는 이 앱의 "드롭 스탭" 휴머나이저 프리셋 추천 — 균일하지만 탑노트가 살아 있게.'],
  mix:['사이드체인 60~80%. 킥 뒤에서 숨쉬게.','리드와 같은 패치 계열이면 리드보다 3~5dB 낮게, 컷오프도 약간 낮게.']})},
 {g:'코드·플럭',id:'s-pianopluck',t:'⑥ 유포릭 피아노 플럭 (스웨디시 스타일)',h:recipe({
  role:'브레이크다운 피아노 대체 또는 드롭 리드에 레이어하는 "피아노 같은 플럭". 스웨디시 프로그레시브의 상징.',
  sy:['A1: Saw, Voices 3, Detune 0.6. A2: Pulse(또는 Triangle) +1옥타브, Volume 4.','B1: Sine 또는 Triangle, Voices 1 (몸통/어택 둔화 방지).','Filter: Lowpass 24dB, Cutoff 3, Resonance 1.','Mod Env 1 → Cutoff +5, A 0, D 3.5, S 0.5.','Amp Env A: A 0, D 5.5, S 0, R 3. Amp Env B: A 0, D 6, S 1, R 3.'],
  se:['OSC A: Saw, Unison 3, Detune 0.08. OSC B: Triangle +12, Level 30%. OSC C(Multisample)에 실제 피아노 샘플을 아주 작게 섞어도 좋음.','Filter LP 24, Cutoff 1~1.5kHz, ENV 2 → Cutoff +40%, D 300ms, S 5%.','ENV 1: A 1ms, D 600ms, S 0, R 400ms.','벨로시티 → Filter Cutoff 모듈레이션 +15% (세게 칠수록 밝게 = 피아노처럼).'],
  fx:['Delay 3/16 핑퐁 20%','Reverb Hall 25~35%','EQ 150Hz 하이패스, 3kHz 살짝 부스트'],
  play:['이 앱의 "피아니스트" 벨로시티 + "피아노 브레이크다운" 보이싱이 이 패치와 가장 잘 맞습니다.','벨로시티 → 컷오프 연결이 있으므로 휴머나이저의 탑노트 강조가 그대로 음색 차이로 나타납니다.'],
  mix:['브레이크다운에서는 리버브를 크게, 드롭에서는 줄이고 사이드체인 30%.','실제 피아노와 레이어할 땐 이 플럭을 2~4kHz 위주로 남기고 저역은 피아노에 맡기기.']})},
 {g:'코드·플럭',id:'s-pluck',t:'⑦ 클래식 프로그레시브 플럭 / 아르프',h:recipe({
  role:'16분 아르페지오, 카운터 멜로디, 빌드업의 리듬 엔진.',
  sy:['A1: Saw, Voices 4, Detune 1.5. A2: Saw −1옥타브, Volume 4.','Filter: Lowpass 24dB, Cutoff 2.5, Resonance 2.','Mod Env 1 → Cutoff +5.5, D 2.2, S 0.','Amp Env: A 0, D 3, S 0, R 2.','<b>Arpeggiator</b>: Mode Up, Range 1~2 oct, Time 1/16, Gate 50~70%, Velocity 패턴으로 강약.'],
  se:['OSC A: Saw, Unison 5, Detune 0.15. Filter LP 24 Cutoff 500~800Hz, ENV 2 → Cutoff +50%, D 160ms, S 0.','ENV 1: A 0, D 300ms, S 0, R 250ms.','Arpeggiator: 16분 Up, Octave 2, Gate 60%, 또는 클립 시퀀서로 직접 패턴.','LFO(1/1 마디, 톱니 상승) → Cutoff 소량: 마디마다 점점 밝아지는 움직임.'],
  fx:['Delay 3/16 핑퐁 25~30% — 아르프의 생명','Reverb 20%','EQ 200Hz 하이패스'],
  play:['이 앱 피아노 롤에서 코드를 길게 그리고 Sylenth/Serum 아르페지에이터에 맡기거나, 이 앱 아르프(업/페달/1-5-8-10)를 MIDI로 내보내세요.','빌드업에선 필터 컷오프 오토메이션 + 노트 길이 점점 늘리기.'],
  mix:['리드와 음역이 겹치면 한 옥타브 아래로.','딜레이 리턴을 사이드체인해 킥 공간 확보.']})},
 {g:'코드·플럭',id:'s-bell',t:'⑧ 벨 / 글라스 플럭',h:recipe({
  role:'반짝이는 탑 레이어, 인트로 모티프, 브레이크다운 장식.',
  sy:['A1: Sine. A2: Sine, Octave +2, Note +7(5도 위), Volume 4.','B1: Triangle +1옥타브, Volume 3.','Filter: Bypass 또는 Highpass 낮게.','Amp Env: A 0, D 6, S 0, R 5.','LFO → Pitch 아주 미세(0.05)한 비브라토.'],
  se:['OSC A: Sine. OSC B: Sine +24반음+7(FM 느낌을 원하면 Warp의 FM(from B)), Level 30%.','Warp FM 양을 ENV 2로 빠르게 줄이면 "딩" 하는 금속성 어택.','ENV 1: A 0, D 900ms, S 0, R 700ms.'],
  fx:['Delay 1/8 또는 3/16 30%','Reverb Hall 40%','Chorus 소량'],
  play:['높은 음역(C6 근처)에서 단순한 모티프.','벨로시티를 크게 흔들면 자연스러움 (이 앱의 휴머나이즈 6~8%).'],
  mix:['500Hz 이하 컷. 리드와 리듬이 겹치지 않게 콜&리스폰스로.']})},
 {g:'패드·앰비언트',id:'s-pad',t:'⑨ 와이드 브레이크다운 패드',h:recipe({
  role:'브레이크다운의 감정 바닥. 코드를 부드럽고 넓게 감싸는 소리.',
  sy:['A1: Saw, Voices 8, Detune 2.5, Stereo 10. A2: Triangle −1옥타브, Volume 4.','B1: Saw +1옥타브, Voices 6, Detune 3, Volume 3.','Filter: Lowpass 12dB, Cutoff 4.5, Resonance 1.','Amp Env: A 4~5, D 6, S 8, R 6.','LFO 1 (Sync 2/1 또는 4/1, Sine) → Cutoff +1.5: 숨쉬는 움직임.'],
  se:['OSC A: Saw, Unison 7, Detune 0.2. OSC B: 부드러운 웨이브테이블(예: 아날로그 계열), WT Pos를 LFO로 천천히.','OSC C: Granular 모드에 패드/보컬 샘플 — Density 높게, Position을 천천히 이동시키면 시네마틱 텍스처.','Filter LP 12, Cutoff 1.8~2.5kHz.','ENV 1: A 500ms~1s, S 90%, R 1.5s.'],
  fx:['Chorus 30~40%','Reverb Hall 대형 40~60%','Delay 1/4 15%','EQ 200~300Hz 하이패스'],
  play:['이 앱의 "하이 패드" 또는 "감성 add9 오픈 5도" 보이싱 + "패드" 벨로시티 프리셋.','코드 길이 그대로 블록으로 길게.'],
  mix:['드롭에서는 볼륨을 크게 줄이거나 하이패스를 올려 리드에게 자리 양보.','사이드체인 40%로 드롭에서도 그루브 유지.']})},
 {g:'패드·앰비언트',id:'s-air',t:'⑩ 에어 / 노이즈 패드',h:recipe({
  role:'고역의 공기감. 인트로·브레이크다운의 "숨" 레이어.',
  sy:['A1: Noise, Volume 6. A2: Saw +2옥타브, Voices 8, Detune 5, Volume 2.','Filter: Bandpass 12dB, Cutoff 7, Resonance 3.','LFO 1 (Sync 4/1) → Cutoff ±2.','Amp Env: A 6, S 9, R 7.'],
  se:['NOISE 오실레이터에 "air"·"breath" 계열 노이즈, Level 40%.','OSC A: Sine +24, Level 10%.','Filter BP, LFO → Cutoff.'],
  fx:['Reverb Hall 60%','Stereo 폭 최대(Hyper/Dimension)','EQ 2kHz 이하 하이패스'],
  play:['코드 루트 하나만 길게 눌러도 충분.'],mix:['볼륨은 "없어지면 아쉬운" 정도까지만. 너무 크면 믹스 전체가 흐려짐.']})},
 {g:'패드·앰비언트',id:'s-strings',t:'⑪ 스트링 앙상블',h:recipe({
  role:'시네마틱 브레이크다운, 리드 밑의 따뜻한 지지대.',
  sy:['A1·A2: Saw, Voices 6, Detune 2 / Octave +1 Volume 4.','Filter: Lowpass 12dB, Cutoff 5.','Amp Env: A 3, D 6, S 9, R 4.','LFO → Pitch 0.1 (Sync off, 5Hz) 비브라토.'],
  se:['OSC A: 스트링 계열 웨이브테이블 또는 Multisample 스트링, OSC B: Saw −12 소량.','ENV 1: A 300ms, R 900ms. LFO 5Hz → Fine pitch.'],
  fx:['Chorus 50%','Reverb Hall 45%','EQ 하이패스 150Hz, 6kHz 이상 살짝 감쇠'],play:['보이싱 "드롭2/드롭3"이나 "10도 스프레드"가 현악 같은 배치.'],mix:['패드와 함께 쓰면 하나만 강조.']})},
 {g:'베이스',id:'s-offbeat',t:'⑫ 오프비트 미드 베이스',h:recipe({
  role:'킥 사이 8분 오프비트를 채우는 프로그레시브 하우스의 기본 베이스.',
  sy:['A1: Saw, Voices 2, Detune 0.6. A2: Pulse, Volume 4.','Filter: Lowpass 24dB, Cutoff 3.5, Resonance 2, Drive 2.','Mod Env 1 → Cutoff +3, D 2, S 2.','Amp Env: A 0, D 3, S 7, R 0.5.','Misc: Mono, Portamento 0.'],
  se:['OSC A: Saw, Unison 2~3, Detune 0.05, Width 낮게(30%) — 저역은 좁게.','OSC B: Square, Level 35%.','Filter LP 24, Cutoff 600~900Hz, ENV 2 → Cutoff +30%, D 150ms.','ENV 1: A 1ms, D 200ms, S 70%, R 60ms. Mono.'],
  fx:['Distortion 소량(새추레이션) — 작은 스피커에서도 들리게','EQ: 40~60Hz 하이패스(서브와 분리), 100~150Hz 정리','Multiband Comp 소량'],
  play:['8분 오프비트, 코드 루트. 이 앱의 베이스 "오프비트" 스타일 그대로.','노트 길이 8분보다 약간 짧게(게이트 80~90%).'],
  mix:['사이드체인 60~70%.','서브와 같은 음을 연주하되 서브 대역은 비워 두기 (Stereo Shaper/모노).']})},
 {g:'베이스',id:'s-rolling',t:'⑬ 롤링 프로그레시브 베이스 (16분)',h:recipe({
  role:'킥 위치를 비운 16분 연타(.xxx) — 딥/테크/트랜스 계열 추진력.',
  sy:['A1: Saw, Voices 1. A2: Pulse −1옥타브, Volume 3.','Filter: Lowpass 24dB, Cutoff 2.5, Resonance 3.','Mod Env 1 → Cutoff +4, D 1.2, S 0.5.','Amp Env: A 0, D 1.5, S 4, R 0.3.'],
  se:['OSC A: Saw, OSC B: PWM −12, Filter LP 24 Cutoff 450Hz, ENV 2 → +45% D 100ms.','ENV 1: A 0, D 120ms, S 40%, R 40ms.','벨로시티 → Cutoff로 16분 강약을 음색으로.'],
  fx:['Distortion 20%','EQ 하이패스 40Hz','짧은 리버브 없음 (저역은 드라이하게)'],
  play:['킥 자리(정박)는 비우고 나머지 3개 16분을 채움 — 이 앱 "롤링 16분".','두 번째 16분을 강하게(벨로시티 105), 나머지 85~90.'],
  mix:['사이드체인 약하게(30~45%) — 이미 킥을 피하므로.']})},
 {g:'베이스',id:'s-sub',t:'⑭ 서브 베이스',h:recipe({
  role:'믹스의 바닥. 클럽에서 몸으로 느끼는 30~80Hz.',
  sy:['A1: Sine, Voices 1, Retrig ON(위상 일정 → 펀치 일관).','나머지 오실레이터 OFF, Filter Bypass.','Amp Env: A 0, D 0, S 10, R 0.3~0.5.','Mono + Portamento 0 (또는 글라이드 원하면 Legato 0.5).'],
  se:['SUB 오실레이터 또는 OSC A Sine, Unison 1, Phase 고정(Rand 0).','필터 끔. ENV 1: A 1ms, S 100%, R 60ms. Mono.'],
  fx:['FX 거의 없음. 원하면 아주 약한 새추레이션으로 2배음만 살짝(작은 스피커 대응).','EQ: 25~30Hz 하이패스, 120Hz 이상 로우패스'],
  play:['코드 루트를 E1~D#2 근처에서. 너무 낮은 키(C1 이하)는 클럽 시스템에서도 잘 안 들림.','오프비트 또는 롤링 미드 베이스와 같은 리듬, 또는 롱노트.'],
  mix:['완전 모노. 사이드체인 70~90% (킥과 서브가 동시에 울리지 않게).','킥 기본음(50~60Hz)과 서브 음정이 맞으면 더 단단 — 킥을 곡 키에 튜닝.']})},
 {g:'베이스',id:'s-reese',t:'⑮ 리스 / 다크 프로그 베이스',h:recipe({
  role:'어둡고 움직이는 베이스. 딥·다크 프로그레시브, 브레이크 후 그루브 파트.',
  sy:['A1: Saw, A2: Saw Fine −12~−18 (살짝 어긋나게), Voices 각 2, Detune 1.','Filter: Lowpass 24dB, Cutoff 4, Resonance 2, Drive 4.','LFO 1 (Sync 1/1~2/1, Triangle) → Cutoff ±1.5.','Mono, Legato, Portamento 1.'],
  se:['OSC A·B: Saw, B를 Fine −15cent. Unison 2.','Filter LP 24 Cutoff 1.2kHz, LFO(1마디) → Cutoff.','Distortion → 다시 Filter(FX 랙의 Filter)로 고역 정리.'],
  fx:['Distortion Tube 30%','Chorus 소량(중역만)','EQ: 250Hz 이하는 모노화'],play:['긴 노트, 슬라이드.'],mix:['200Hz 이하를 모노로(Stereo Shaper) — 위상 문제 방지.']})},
 {g:'FX',id:'s-riser',t:'⑯ 화이트 노이즈 라이저 / 업리프터',h:recipe({
  role:'빌드업의 긴장. 8~16마디에 걸쳐 올라가는 노이즈.',
  sy:['A1: Noise. Filter: Highpass 12dB → Cutoff를 DAW 오토메이션으로 2 → 9.','또는 Bandpass + Resonance 5로 "쉬익" 하는 휘슬 성분.','Amp Env: A 0, S 10. LFO(Sync 1/16, Square) → Volume을 오토메이션으로 점점 빠르게 하면 게이트 라이저.'],
  se:['NOISE: White, Level 100%. Filter 1 HP, Cutoff 오토메이션(매크로 1).','Filter 2 BP 병렬, Res 50% — 매크로 1로 함께 이동.','LFO → Pitch(오실레이터 피치 상승) +12~24 반음으로 "슈우욱".'],
  fx:['Reverb 50~70% (꼬리가 드롭 직전까지)','Delay 1/8 20%','Stereo 폭 최대'],
  play:['드롭 직전 1박은 모두 비우기 — 침묵이 드롭을 키웁니다.'],mix:['라이저는 드롭에서 리버브 꼬리를 컷(오토메이션/사이드체인)하세요.']})},
 {g:'FX',id:'s-down',t:'⑰ 다운리프터 · 임팩트',h:recipe({
  role:'드롭 첫 박의 "쿵" + 아래로 떨어지는 노이즈.',
  sy:['A1: Noise, Filter Lowpass, Mod Env 1 → Cutoff −(내려가게), D 7.','A2: Sine, Octave −2, Mod Env 2 → Pitch −(큰 값), Decay 6 → 피치가 떨어지는 붐.','Amp Env: A 0, D 8, S 0, R 5.'],
  se:['OSC A: Sine, ENV 2 → Pitch −24반음, D 1.5s. NOISE: ENV 3 → Filter LP Cutoff 하강.','Reverb 대형으로 꼬리.'],
  fx:['Reverb Hall 대형 50%','Distortion 소량 (임팩트 밀도)'],play:['드롭 1박에 한 번. 크래시와 함께.'],mix:['서브 대역이 킥/서브와 겹치므로 드롭 첫 1~2박만 울리고 빠르게 감쇠.']})},
 {g:'FX',id:'s-gate',t:'⑱ 트랜스 게이트 코드',h:recipe({
  role:'16분으로 잘게 썰린 코드 — 트랜스·업리프팅 프로그레시브.',
  sy:['A1·A2: Saw, Voices 8, Detune 3. Filter LP 24, Cutoff 6.','Amp Env: A 0, D 2, S 0, R 1 (짧게) 또는 긴 노트 + LFO(Square, 1/16) → Volume.','Mod Env 1 → Cutoff 소량.'],
  se:['Saw 슈퍼소우 + LFO를 "Step/Gate" 모양으로 그려 Master Level에 연결 (1/16).','또는 이 앱 주법 "트랜스 게이트 16분"을 MIDI로 사용.'],
  fx:['Delay 3/16 30%','Reverb 30%'],play:['게이트 패턴을 x.xx x.x. 처럼 변주하면 그루브.'],mix:['사이드체인 50%.']})},
 {g:'레이어링',id:'s-layer',t:'⑲ 프로 레이어링 전략',h:`
  <p class="lead">프로들의 "한 개처럼 들리는 리드"는 대개 3~5개 패치의 합입니다.</p>
  ${tbl(['레이어','역할','음역/처리'],[['메인 슈퍼소우','폭·에너지','C4~C6, 300Hz 하이패스'],['옥타브 업 소우','반짝임','+12, 볼륨 −8dB'],['피아노 플럭','어택·선명도','동일 옥타브, 어택만'],['사인 서브리드','몸통','−12, 모노, 아주 작게'],['화이트 노이즈','공기감','노트와 같은 엔벨로프, 3kHz 이상']])}
  ${ol(['모든 레이어를 <b>같은 MIDI</b>로 연주 (FL: 레이어 채널 또는 패턴 복제).','각 레이어를 <b>담당 대역만</b> 남기고 EQ로 깎기.','리드 버스로 묶어 버스에서 글루 컴프·리버브·사이드체인.','<b>위상 확인</b>: 레이어를 하나씩 켜며 저역이 줄어들면 위상 반전/리트리거 조정.'])}
  ${tip('코드도 같은 원리: <b>왼손(저역 보이싱) = 피아노/패드</b>, <b>오른손(상단 보이싱) = 슈퍼소우</b>. 이 앱의 MIDI 내보내기에서 "왼손/오른손 분리"를 켜면 바로 레이어용 트랙이 나옵니다.')}`},
 {g:'레이어링',id:'s-check',t:'⑳ 사운드 디자인 체크리스트',h:ol([
  '코드를 재생했을 때 탁하지 않은가? (보이싱 폭·하이패스 확인)','모노로 들어도 사라지지 않는가? (디튠/스테레오 과다)','같은 대역에 두 악기가 겹치지 않는가?','레퍼런스 곡과 같은 볼륨에서 비교했는가?',
  '사이드체인 양이 장르 레퍼런스와 비슷한가?','리버브·딜레이가 드롭에서 리듬을 흐리지 않는가?','작은 스피커(폰)에서 베이스가 들리는가? (새추레이션)','프리셋 이름과 버전을 저장했는가?'])}
];

const MIX_GUIDE = [
 {g:'준비',id:'m-intro',t:'이 가이드북 사용법',h:`<p class="lead">FL Studio에서 멜로딕 프로그레시브 하우스를 믹싱·마스터링하는 프로 워크플로를 순서대로 정리했습니다.</p>
  ${ul(['모든 수치는 출발점. 반드시 <b>레퍼런스 트랙과 같은 라우드니스로 맞춰서</b> 비교하세요.','플러그인은 FL Studio 기본 플러그인 기준으로 쓰고, 많이 쓰이는 서드파티 대안을 괄호로 적었습니다.','순서: 준비 → 게인 스테이징 → 라우팅 → 로우엔드 → 사이드체인 → EQ → 컴프 → 신스 처리 → 공간 → 스테레오 → 드럼 → 오토메이션 → 마스터링 → 라우드니스 → 익스포트.'])}`},
 {g:'준비',id:'m-prep',t:'1. 작업 환경 준비',h:`${ul(['<b>샘플레이트</b> 44.1kHz 또는 48kHz, 오디오 버퍼는 믹싱 때 크게(512~1024) — CPU 여유.','<b>모니터링 레벨</b>: 대화 소리 정도(약 75~80dB SPL)로 작게. 크게 들으면 저역·고역이 과대평가됩니다.',
  '<b>레퍼런스 트랙</b> 2~3곡을 프로젝트에 불러와 별도 믹서 트랙(마스터를 거치지 않도록 출력 라우팅)에 두고, 라우드니스를 맞춰 비교.','<b>Wave Candy</b>를 마스터에 걸어 스펙트럼·피크·오실로스코프 확인. 무료 <b>Youlean Loudness Meter</b>로 LUFS 측정 권장.',
  '<b>믹서 템플릿</b>: 드럼 / 베이스 / 코드·패드 / 리드 / FX / 보컬 버스 + 리버브·딜레이 Send를 미리 만들어 두기.'])}`},
 {g:'기초',id:'m-gain',t:'2. 게인 스테이징',h:`${ul(['각 믹서 트랙 피크를 <b>−10~−6 dBFS</b>, 킥은 −6 dBFS 근처에서 시작.','마스터 페이더는 0으로 두고, 믹스 전체 피크가 <b>−6 dBFS</b> 정도가 되게(마스터링 헤드룸).','볼륨 조절은 <b>채널 랙 볼륨/Fruity Balance</b>로 하고, 믹서 페이더는 오토메이션·최종 밸런스용으로 남겨 두기.','플러그인 앞뒤 레벨을 맞추기 — 소리가 커져서 좋게 들리는 착각 방지.'])}
  ${tbl(['요소','시작 피크 (dBFS)'],[['킥','−6'],['서브','−8 ~ −10'],['미드 베이스','−10 ~ −12'],['클랩/스네어','−10'],['하이햇/탑','−16 ~ −20'],['코드/패드','−12 ~ −16'],['리드 (버스)','−8 ~ −10'],['FX/라이저','−14 ~ −18']])}`},
 {g:'기초',id:'m-route',t:'3. FL 믹서 라우팅 구조',h:`${ol(['채널 랙의 각 악기를 개별 믹서 트랙에 연결 (채널 선택 후 믹서 트랙에서 Ctrl+L).','악기 트랙들을 <b>버스</b>로 보내기: 소스 트랙 선택 → 버스 트랙 하단 화살표 <b>우클릭 → "Route to this track only"</b>.','<b>Send</b> 트랙(Reverb, Delay)을 만들고 Send 레벨로 양 조절. Send 트랙 리버브는 Wet 100%.','<b>사이드체인 트리거</b>: 킥 트랙에서 대상 트랙 화살표 <b>우클릭 → "Sidechain to this track"</b>.','<b>고스트 킥</b>(소리 안 나는 킥 패턴)을 별도 트랙에 두고 사이드체인 신호로만 쓰면 드롭/브레이크 어디서든 일관된 펌핑.'])}
  ${tbl(['버스','포함','버스 처리 예'],[['DRUMS','킥 제외 드럼','글루 컴프, 소프트 클리퍼'],['LOW','킥·서브·미드베이스','모노화 <120Hz, 리미팅 소량'],['MUSIC','코드·패드·플럭','하이패스, 사이드체인'],['LEAD','리드 레이어 전부','EQ, OTT 소량, 사이드체인'],['FX','라이저·임팩트','하이패스, 리버브']])}`},
 {g:'핵심',id:'m-low',t:'4. 로우엔드 (킥 · 서브 · 베이스)',h:`${ul(['킥 펀치 50~60Hz, 바디 100Hz, 클릭 2~5kHz. <b>킥 기본음을 곡 키에 맞추면</b> 서브와 충돌이 줄어듭니다.','서브는 <b>완전 모노</b>, 30Hz 이하 하이패스(20~25Hz 슬로프).','미드 베이스는 서브 대역(60~80Hz 이하)을 하이패스로 비워 두기.','킥과 서브가 동시에 울리지 않도록 사이드체인 70~90% 또는 볼륨 쉐이핑.','킥 이외 모든 트랙에 하이패스(코드 150~300Hz, 리드 200~300Hz, 하이햇 300~500Hz).','<b>Fruity Stereo Shaper</b>/<b>Stereo Enhancer</b>로 LOW 버스 저역을 모노 확인.'])}
  ${warn('하이패스를 "모든 곳에 습관적으로" 걸어도 슬로프가 겹치면 저역 위상이 바뀝니다. 들어 보면서 필요한 만큼만.')}`},
 {g:'핵심',id:'m-side',t:'5. 사이드체인 — 3가지 방법',h:`
  <h3>A. Fruity Limiter (COMP 모드)</h3>${ol(['킥(또는 고스트 킥) → 대상 트랙으로 "Sidechain to this track".','대상 트랙에 Fruity Limiter → <b>COMP</b> 탭 → SIDECHAIN 노브로 킥 트랙 번호 선택.','Threshold −20~−30dB, Ratio 높게(10:1~∞), Attack 짧게, Release 박자에 맞게(128BPM 기준 150~250ms).'])}
  <h3>B. 볼륨 쉐이핑 (가장 정확·일관)</h3>${ul(['FL 기본: <b>Gross Beat</b>의 볼륨 엔벨로프(Sidechain 계열 프리셋)로 4분음표마다 덕킹.','서드파티: Kickstart 2, LFOTool, ShaperBox 등.','장점: 킥 소리와 무관하게 모양이 일정 → 프로그레시브 하우스의 매끈한 펌핑.'])}
  <h3>C. Fruity Peak Controller</h3>${ul(['킥 트랙에 Peak Controller → 대상 트랙의 볼륨/필터에 링크(Tools → Link to controller), Inverted 매핑.','볼륨뿐 아니라 <b>필터 컷오프</b>나 리버브 양도 킥에 반응하게 할 수 있음.'])}
  ${tbl(['대상','덕킹 양'],[['서브','80~95%'],['미드 베이스','60~80%'],['코드/패드','50~70%'],['리드','20~40%'],['리버브 리턴','40~60%'],['보컬','0~15%']])}`},
 {g:'핵심',id:'m-eq',t:'6. EQ 전략 (Fruity Parametric EQ 2)',h:`${ul(['<b>먼저 빼고, 나중에 더한다</b>: 문제 주파수 컷 → 필요한 것만 살짝 부스트.','좁은 Q로 부스트한 채 스윕해서 거슬리는 공진을 찾아 −3~−6dB 컷.','부스트는 넓은 Q, ±3dB 이내가 원칙.','같은 대역이 겹치는 두 악기 중 하나는 그 대역을 양보(<b>상보 EQ</b>).','다이내믹 EQ(예: FabFilter Pro-Q의 다이내믹 밴드)로 리드의 2~4kHz 쏘는 순간만 눌러 주기.'])}
  ${tbl(['악기','하이패스','주의 대역','살릴 대역'],[['킥','—','200~400Hz 박스감','55Hz, 3kHz 클릭'],['클랩','150~250Hz','500Hz 탁함','1~2kHz, 6kHz'],['하이햇','300~600Hz','—','8~12kHz 공기'],['코드 슈퍼소우','150~300Hz','300~500Hz 머디','3~6kHz'],['피아노','80~150Hz','250~400Hz','2~4kHz'],['리드','200~300Hz','1~2kHz 비음','3~5kHz, 10kHz'],['패드','200~400Hz','—','1~3kHz 부드럽게'],['보컬','100~150Hz','250~350Hz','3kHz, 10kHz']])}`},
 {g:'핵심',id:'m-comp',t:'7. 컴프레션 · 병렬 압축 · OTT',h:`${ul(['<b>드럼 버스 글루</b>: Fruity Compressor — Ratio 2:1~4:1, Attack 10~30ms(트랜지언트 보존), Release 100~200ms, GR 2~3dB.','<b>병렬 압축</b>: 드럼 Send 트랙에 강한 압축(Ratio 8:1+, GR 10dB) 후 원본 아래로 섞기 — 펀치는 유지하고 밀도↑.','<b>OTT 스타일 멀티밴드</b>(Fruity Multiband Compressor 또는 무료 Xfer OTT): 리드·플럭에 Depth 15~30%만. 과하면 숨소리와 노이즈가 커짐.','<b>버스 클리퍼</b>: Fruity Soft Clipper를 드럼 버스 끝에 — 피크 1~2dB를 깎아 마스터 리미터 부담을 줄임.'])}
  ${warn('압축은 "더 크게"가 아니라 "더 일정하게". 압축 전후 레벨을 같게 맞춰 비교하세요.')}`},
 {g:'악기별',id:'m-synth',t:'8. 슈퍼소우 리드 · 코드 처리',h:`${ol(['레이어별로 대역 정리(사운드 가이드북 ⑲ 참고) 후 LEAD 버스로.','LEAD 버스: Parametric EQ 2(250Hz 하이패스) → 새추레이션 소량(Fruity Waveshaper 또는 Soundgoodizer 낮게) → OTT 15~25% → 사이드체인 25~40% → Send(리버브·딜레이).','<b>미드/사이드 EQ</b>: 사이드 채널 300Hz 이하를 깎아 저역은 모노, 고역은 넓게.','코드(MUSIC 버스)는 리드보다 3~5dB 낮게, 2~4kHz를 살짝 깎아 리드 자리 비워 주기.','드롭에서 코드와 리드가 같은 슈퍼소우면 리드만 Hyper/Dimension으로 더 넓게.'])}`},
 {g:'악기별',id:'m-space',t:'9. 공간: 리버브 & 딜레이',h:`${ul(['<b>Send 방식</b>: Reverb 트랙(Fruity Reeverb 2, Wet 100%) + Delay 트랙(Fruity Delay 3, 3/16 또는 1/4 핑퐁).','리버브 리턴에 <b>EQ: 300~500Hz 하이패스, 8~10kHz 로우패스</b> — 깨끗한 공간.','프리딜레이를 박자에 맞추기(1/64~1/32) — 원음과 분리.','리버브·딜레이 리턴도 사이드체인 40~60% — 드롭 리듬 유지.','브레이크다운: 리버브 Send를 오토메이션으로 크게, 드롭 직전 0으로 컷 → 대비 극대화.'])}
  ${tbl(['용도','타입','Decay','Pre-delay'],[['코드/패드','Hall','2.5~4s','20~40ms'],['리드','Hall/Plate','1.8~3s','10~30ms'],['플럭/아르프','Plate','1.2~2s','10ms'],['클랩/스네어','Room/Plate','0.8~1.5s','0~10ms'],['브레이크 FX','Huge Hall','5s+','40ms']])}`},
 {g:'악기별',id:'m-stereo',t:'10. 스테레오 이미지',h:`${ul(['120Hz 이하는 모노(킥·서브·베이스 저역).','폭은 "고역일수록 넓게": 하이햇·FX·패드 > 코드 > 리드 > 보컬 > 베이스.','Haas 효과(좌우 딜레이)는 모노 호환성이 나빠지므로 소량만.','주기적으로 <b>마스터를 모노로</b> 들어 보기 — 사라지는 악기가 있으면 디튠/스테레오 과다.','Wave Candy의 벡터스코프/위상 표시로 마이너스 상관(역위상)이 나오지 않는지 확인.'])}`},
 {g:'악기별',id:'m-drums',t:'11. 드럼 처리',h:`${ul(['클랩 2~3개 레이어(어택 / 바디 / 꼬리), 살짝 다른 타이밍으로 넓이.','하이햇 벨로시티를 패턴마다 다르게(이 앱의 휴머나이저 원리처럼) — 기계적 느낌 제거.','<b>Transient Processor</b>로 킥 어택 강조/꼬리 단축 → 서브와 공간 분리.','오픈햇·라이드는 오프비트에, 볼륨은 킥 대비 −12~−18dB.','드럼 버스 끝에 Soft Clipper로 피크 정리.'])}`},
 {g:'편곡',id:'m-auto',t:'12. 브레이크다운 · 빌드업 오토메이션',h:`${ol(['브레이크다운: 킥 제거, 코드 리버브↑, 하이패스 필터로 저역을 서서히 비움.','빌드업 8~16마디: 리드/코드 <b>로우패스 컷오프 상승</b>, 스네어 롤 가속(4분→8분→16분→32분), 화이트노이즈 라이저, 피치 라이저.','빌드업 마지막 1~2마디: 리버브 꼬리 키우고 볼륨 살짝 낮춤(드롭이 더 커 보이게).','드롭 직전 1박 <b>무음</b> 또는 보컬 한 마디만.','드롭: 임팩트 + 크래시, 모든 오토메이션 원위치.','FL: 노브 우클릭 → <b>Create automation clip</b>, 또는 Tools → Last tweaked → Create automation clip.'])}`},
 {g:'편곡',id:'m-check',t:'13. 믹스 체크리스트 & 레퍼런스 비교',h:ol(['레퍼런스와 <b>LUFS를 맞춘 상태</b>에서 A/B.','저역(킥/서브) 밸런스를 서브우퍼 없는 환경에서도 확인.','헤드폰 / 모니터 / 폰 / 자동차 크로스체크.','모노 체크.','작은 볼륨에서도 리드와 킥이 들리는가?','드롭이 브레이크다운보다 "체감상" 크게 느껴지는가? (라우드니스가 아니라 밀도·폭·저역의 대비)','하루 쉬고 다시 듣기.'])},
 {g:'마스터링',id:'m-master',t:'14. 마스터링 체인 (FL Studio)',h:`${tbl(['순서','플러그인','설정 출발점'],[
  ['1','Fruity Parametric EQ 2','20~25Hz 하이패스, 필요 시 넓은 Q로 ±1dB 톤 보정'],
  ['2','Fruity Compressor (글루)','Ratio 1.5~2:1, Attack 30ms, Release Auto/100ms, GR 1~2dB'],
  ['3','Maximus (멀티밴드)','저역 밴드 Mono 처리·약한 압축, 중역/고역 1~2dB 정리'],
  ['4','새추레이션 (선택)','Soundgoodizer/Waveshaper 아주 약하게'],
  ['5','Fruity Soft Clipper','피크 1~2dB 클리핑 — 리미터 부담 감소'],
  ['6','Fruity Limiter / Maximus 리미터','Ceiling −0.3 ~ −1.0 dB, GR 피크에서 3~5dB 이내'],
  ['7','미터 (Wave Candy / Youlean)','LUFS · True Peak · 스펙트럼 확인']])}
  ${tip('마스터 체인은 <b>믹스가 끝난 뒤</b>, 별도 프로젝트나 마스터 트랙에서. 믹스 중엔 리미터를 꺼 두거나 아주 가볍게.')}`},
 {g:'마스터링',id:'m-loud',t:'15. 라우드니스 목표',h:`${tbl(['용도','Integrated LUFS','True Peak'],[['클럽/DJ용 마스터 (EDM 일반)','−8 ~ −6','−0.3 ~ −1.0 dBTP'],['스트리밍 정규화 기준 (Spotify 등)','−14 근처로 자동 조정','−1.0 dBTP'],['다이내믹을 살린 버전','−10 ~ −9','−1.0 dBTP']])}

let GQ='', GSEL={gs:'s-intro',gm:'m-intro'};
function renderGuide(which){
  const data=which==='gs'?SOUND_GUIDE:MIX_GUIDE; const root=$('#v-'+which); root.innerHTML='';
  const toc=h('div',{class:'gtoc'}), body=h('article',{class:'gbody'});
  const q=h('input',{type:'search',placeholder:'가이드북 검색…',value:GQ,oninput:e=>{ GQ=e.target.value; drawToc(); }});
  toc.append(h('div',{class:'gtitle'},which==='gs'?'🎛 사운드 메이킹 가이드북':'🎚 믹싱 · 마스터링 가이드북',h('small',null,which==='gs'?'Sylenth1 · Serum 2로 만드는 멜로딕 프로그레시브 하우스 사운드':'FL Studio 프로 믹싱·마스터링 테크닉')),q);
  const list=h('div'); toc.append(list);
  const show=id=>{ GSEL[which]=id; const c=data.find(x=>x.id===id)||data[0]; body.innerHTML=`<div class="gcat">${c.g}</div><h2>${c.t}</h2>`+c.h;
    const i=data.indexOf(c); body.append(h('div',{class:'gnav'},i>0?h('button',{onclick:()=>show(data[i-1].id)},'← '+data[i-1].t):h('span'),i<data.length-1?h('button',{class:'pri',onclick:()=>show(data[i+1].id)},data[i+1].t+' →'):h('span')));
    body.scrollTop=0; drawToc(); };
  const drawToc=()=>{ list.innerHTML=''; let g=null; const qq=GQ.toLowerCase();
    data.filter(c=>!qq||(c.t+c.h).toLowerCase().includes(qq)).forEach(c=>{ if(c.g!==g){ g=c.g; list.append(h('div',{class:'ggrp'},g)); } list.append(h('div',{class:'gitem'+(GSEL[which]===c.id?' on':''),onclick:()=>show(c.id)},c.t)); }); };
  root.append(toc,body); show(GSEL[which]);
}

const TU={i:0,on:false};
function startTutorial(){ closeModal(); TU.on=true; TU.i=0;
  if(!$('#tutSpot')){ document.body.append(h('div',{id:'tutSpot'}),h('div',{id:'tutCard'})); addEventListener('resize',()=>TU.on&&placeT());
    document.addEventListener('keydown',e=>{ if(!TU.on) return; if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); e.stopImmediatePropagation(); goT(1);} else if(e.key==='ArrowLeft'){ e.preventDefault(); e.stopImmediatePropagation(); goT(-1);} else if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); endT(); } },true); }
  $('#tutSpot').style.display=''; $('#tutCard').style.display=''; showT(); }
function goT(d){ const n=TU.i+d; if(n<0) return; if(n>=TUT_STEPS.length) return endT(); TU.i=n; showT(); }
function showT(){ const s=TUT_STEPS[TU.i]; try{ s.pre&&s.pre(); }catch(e){} const C=$('#tutCard'), n=TUT_STEPS.length; C.innerHTML='';
  C.append(h('div',{class:'tprog'},h('div',{style:'width:'+((TU.i+1)/n*100)+'%'})),h('div',{class:'thead'},h('span',{class:'tnum'},(TU.i+1)+' / '+n),h('button',{class:'sm',onclick:endT},'✕ 건너뛰기')),
    h('h3',null,s.t),h('div',{class:'tb',html:s.b}),h('div',{class:'tnav'},h('button',{onclick:()=>goT(-1),disabled:TU.i===0},'← 이전'),h('button',{class:'pri',onclick:()=>goT(1)},TU.i===n-1?'시작하기 ✓':'다음 →')));
  setTimeout(placeT,90); }
function placeT(){ const s=TUT_STEPS[TU.i], S2=$('#tutSpot'), C=$('#tutCard'); const W=innerWidth, H=innerHeight, cw=Math.min(440,W-20); C.style.width=cw+'px'; const ch=C.offsetHeight;
  const el=s.s?(typeof s.s==='function'?s.s():$(s.s)):null; const r=el&&el.getBoundingClientRect();
  if(!r||!r.width||s.c){ S2.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0`; C.style.left=(W-cw)/2+'px'; C.style.top=Math.max(10,(H-ch)/2)+'px'; return; }
  S2.style.cssText=`left:${r.left-5}px;top:${r.top-5}px;width:${r.width+10}px;height:${r.height+10}px`;
  let x,y; const g=14; if(r.right+g+cw<W){x=r.right+g;y=r.top;} else if(r.left-g-cw>0){x=r.left-g-cw;y=r.top;} else if(r.bottom+g+ch<H){x=r.left;y=r.bottom+g;} else if(r.top-g-ch>0){x=r.left;y=r.top-g-ch;} else {x=W-cw-14;y=H-ch-14;}
  C.style.left=clamp(x,10,W-cw-10)+'px'; C.style.top=clamp(y,10,Math.max(10,H-ch-10))+'px'; }
function endT(){ TU.on=false; $('#tutSpot').style.display='none'; $('#tutCard').style.display='none'; try{ localStorage.setItem('sinivurizer.chords.tut','1'); }catch(e){} setView('lab'); }

boot();
